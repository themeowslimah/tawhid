<div class="virtue" style="margin-top:20px"><div class="virtue-head"><div class="virtue-n">3</div><div class="virtue-head-text"><div class="vh-label">الْفَضِيلَةُ الثَّالِثَةُ · The Third Virtue</div><div class="vh-ar">أَنَّ اللَّهَ تَعَالَى أَوْجَبَ عَلَى نَفْسِهِ أَنْ لَا يُعَذِّبَ مَنْ لَا يُشْرِكُ بِهِ شَيْئًا</div><div class="vh-translit">Anna-llāha taʿālā awjaba ʿalā nafsih an lā yuʿadhdhiba man lā yushriku bihi shayʾā</div><div class="vh-en">Allah has obligated upon Himself not to punish whoever does not associate anything with Him</div></div></div></div>

<div class="body-text"><div class="bt-ar">فَلَقَدْ تَفَضَّلَ اللَّهُ تَعَالَى عَلَى عِبَادِهِ الْمُوَحِّدِينَ: بِأَنَّ مَنْ وَحَّدَ اللَّهَ وَلَمْ يُشْرِكْ بِهِ شَيْئًا وَاجْتَنَبَ الْكَبَائِرَ أَدْخَلَهُ اللَّهُ الْجَنَّةَ وَلَمْ يُعَذِّبْهُ.</div><div class="bt-translit">Fa-laqad tafaḍḍala-llāhu taʿālā ʿalā ʿibādihi l-muwaḥḥidīn: bi-anna man waḥḥada-llāha wa lam yushrik bihi shayʾan wa jtanaba l-kabāʾir adkhalahu-llāhu l-jannah wa lam yuʿadhdhibh.</div><div class="bt-en">Allah — Exalted — has <strong>bestowed grace upon His monotheist servants</strong>: whoever makes tawhid of Allah, <strong>does not associate anything with Him, and avoids the major sins</strong> — Allah will <strong>admit him into Paradise and not punish him</strong>.</div></div>

<div class="hadith"><div class="hadith-label">وَالدَّلِيلُ عَلَى هَذَا · Ḥadīth — Muʿādh ibn Jabal & another narration</div><div class="h-ar">«وَحَقُّ الْعِبَادِ عَلَى اللَّهِ عَزَّ وَجَلَّ أَنْ لَا يُعَذِّبَ مَنْ لَا يُشْرِكُ بِهِ شَيْئًا»<br><br>وَقَوْلُهُ ﷺ: «فَإِنَّ اللَّهَ قَدْ حَرَّمَ عَلَى النَّارِ مَنْ قَالَ: لَا إِلَهَ إِلَّا اللَّهُ، يَبْتَغِي بِذَلِكَ وَجْهَ اللَّهِ»</div><div class="h-translit">Wa ḥaqqu l-ʿibādi ʿalā-llāhi ʿazza wa jalla an lā yuʿadhdhiba man lā yushriku bihi shayʾā.<br><br>Wa qawluhu ﷺ: "Fa-inna-llāha qad ḥarrama ʿalā n-nāri man qāla: lā ilāha illā-llāh, yabtaghī bi-dhālika wajha-llāh."</div><div class="h-en">"The right of the servants upon Allah — Mighty and Majestic — is that He does not punish anyone who does not associate anything with Him." (Bukhārī 2701, Muslim 30)<br><br>And his saying ﷺ: <strong>"Allah has forbidden the Fire for whoever says: 'Lā ilāha illā-llāh,' seeking by it the Face of Allah."</strong> (Bukhārī 5401)</div></div>

<div class="virtue" style="margin-top:12px"><div class="virtue-head"><div class="virtue-n">4</div><div class="virtue-head-text"><div class="vh-label">الْفَضِيلَةُ الرَّابِعَةُ · The Fourth Virtue</div><div class="vh-ar">تَكْفِيرُ الذُّنُوبِ</div><div class="vh-translit">Takfīru dh-dhunūb</div><div class="vh-en">Expiation of Sins</div></div></div></div>

<div class="body-text"><div class="bt-ar">فَمَنْ وَحَّدَ اللَّهَ تَعَالَى وَلَمْ يُشْرِكْ بِهِ شَيْئًا، وَمَاتَ عَلَى ذَلِكَ فَإِنَّ اللَّهَ تَعَالَى -إِذَا شَاءَ- غَفَرَ لَهُ ذُنُوبَهُ جَمِيعًا.</div><div class="bt-translit">Fa-man waḥḥada-llāha taʿālā wa lam yushrik bihi shayʾan, wa māta ʿalā dhālik fa-inna-llāha taʿālā — idhā shāʾa — ghafara lahu dhunūbahu jamīʿan.</div><div class="bt-en">Whoever makes tawhid of Allah, associates <strong>nothing</strong> with Him, and <strong>dies upon that</strong> — Allah, <strong>if He wills</strong>, will <strong>forgive all his sins</strong>.</div></div>

<div class="hadith"><div class="hadith-label">وَالدَّلِيلُ عَلَى هَذَا · Ḥadīth Qudsī — Abū Dharr</div><div class="h-ar">قَالَ رَسُولُ اللَّهِ ﷺ: «يَقُولُ اللَّهُ عَزَّ وَجَلَّ: … وَمَنْ لَقِيَنِي بِقُرَابِ الْأَرْضِ خَطِيئَةً لَا يُشْرِكُ بِي شَيْئًا لَقِيتُهُ بِمِثْلِهَا مَغْفِرَةً»</div><div class="h-translit">Qāla rasūlu-llāhi ﷺ: "Yaqūlu-llāhu ʿazza wa jall: … wa man laqiyanī bi-qurābi l-arḍi khaṭīʾatan lā yushriku bī shayʾan laqītuhu bi-mithlihā maghfirah."</div><div class="h-en">The Messenger of Allah ﷺ said: <strong>"Allah — Mighty and Majestic — says: … Whoever meets Me with an earth-full of sins — without having associated anything with Me — I will meet him with the like of it in forgiveness."</strong> (<em>qurāb al-arḍ</em> = "a filling of the earth" / close to it)</div><div class="h-source">Narrated by Muslim no. 2687</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 What this means in simple words</span><div class="study-note-body">Picture an imaginary scale: on one side, all your sins from life — let\u2019s say enough to fill the whole Earth! On the other side, your tawhid. If your tawhid was real and sincere, Allah says He\u2019ll give you <em>an Earth-full of forgiveness</em> to match. That\u2019s how powerful sincere tawhid is. <em>But</em> — this promise is only for someone who did <strong>not</strong> commit shirk.</div></div>

<div class="virtue" style="margin-top:12px"><div class="virtue-head"><div class="virtue-n">5</div><div class="virtue-head-text"><div class="vh-label">الْفَضِيلَةُ الْخَامِسَةُ · The Fifth Virtue</div><div class="vh-ar">أَنَّ التَّوْحِيدَ أَثْقَلُ شَيْءٍ فِي مِيزَانِ الْعَبْدِ يَوْمَ الْقِيَامَةِ</div><div class="vh-translit">Anna t-tawḥīda athqalu shayʾin fī mīzāni l-ʿabdi yawma l-qiyāmah</div><div class="vh-en">Tawhid is the Heaviest Thing on the Servant\u2019s Scale on the Day of Judgement</div></div></div></div>

<div class="hadith"><div class="hadith-label">وَالدَّلِيلُ عَلَى هَذَا · Ḥadīth — ʿAbdullāh ibn ʿAmr · Nūḥ\u2019s Final Counsel</div><div class="h-ar">أَنَّ النَّبِيَّ ﷺ قَالَ: «إِنَّ نَبِيَّ اللَّهِ نُوحًا ﷺ لَمَّا حَضَرَتْهُ الْوَفَاةُ قَالَ لِابْنِهِ: إِنِّي قَاصٌّ عَلَيْكَ الْوَصِيَّةَ: آمُرُكَ بِاثْنَتَيْنِ، وَأَنْهَاكَ عَنِ اثْنَتَيْنِ، آمُرُكَ بِلَا إِلَهَ إِلَّا اللَّهُ، فَإِنَّ السَّمَاوَاتِ السَّبْعَ، وَالْأَرَضِينَ السَّبْعَ، لَوْ وُضِعَتْ فِي كِفَّةٍ، وَوُضِعَتْ لَا إِلَهَ إِلَّا اللَّهُ فِي كِفَّةٍ، رَجَحَتْ بِهِنَّ لَا إِلَهَ إِلَّا اللَّهُ…»</div><div class="h-translit">Anna n-nabiyya ﷺ qāla: "Inna nabiyya-llāhi Nūḥan ﷺ lammā ḥaḍarathu l-wafātu qāla li-bnih: innī qāṣṣun ʿalayka l-waṣiyyah: āmuruka bi-thnatayn, wa anhāka ʿani thnatayn, āmuruka bi-lā ilāha illā-llāh, fa-inna s-samāwāti s-sabʿ, wa l-araḍīna s-sabʿ, law wuḍiʿat fī kiffah, wa wuḍiʿat lā ilāha illā-llāh fī kiffah, rajaḥat bi-hinna lā ilāha illā-llāh…"</div><div class="h-en">The Prophet ﷺ said: <strong>"When death approached the Prophet Nūḥ ﷺ, he said to his son: 'I am conveying to you the counsel: I command you with two things, and forbid you from two things. I command you with Lā ilāha illā-llāh — for if the seven heavens and the seven earths were placed on one pan of a scale, and Lā ilāha illā-llāh on the other pan, Lā ilāha illā-llāh would outweigh them…'"</strong></div><div class="h-source">Narrated by Aḥmad 11/150 (6583)</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Think about this</span><div class="study-note-body">Imagine the seven heavens (everything up in space) and the seven earths together on one side of a giant scale. On the other side: just the <em>words</em> "lā ilāha illā-llāh" (there is no god but Allah) — if said with real belief and sincerity. Prophet Nūḥ (Noah) ﷺ told his son: <em>these words would be heavier</em>. That\u2019s how valuable real tawhid is — it outweighs <em>everything</em> Allah created!</div></div>`;}

function L3P3(){return `
<div class="virtue"><div class="virtue-head"><div class="virtue-n">6</div><div class="virtue-head-text"><div class="vh-label">الْفَضِيلَةُ السَّادِسَةُ · The Sixth Virtue</div><div class="vh-ar">دُخُولُ الْجَنَّةِ</div><div class="vh-translit">Dukhūlu l-jannah</div><div class="vh-en">Entry into Paradise</div></div></div></div>

<div class="body-text"><div class="bt-ar">فَمَنْ شَهِدَ بِالتَّوْحِيدِ وَعَمِلَ بِمُقْتَضَاهُ بِفِعْلِ الطَّاعَاتِ وَاجْتِنَابِ الْكَبَائِرِ وَالْمُوبِقَاتِ دَخَلَ الْجَنَّةَ، وَمَنْ شَهِدَ بِالتَّوْحِيدِ وَوَقَعَ مِنْهُ تَقْصِيرٌ فِي الْعَمَلِ فَهُوَ تَحْتَ فَتْحِ الْمَشِيئَةِ، إِنْ شَاءَ اللَّهُ عَذَّبَهُ وَإِنْ شَاءَ غَفَرَ لَهُ، وَلَكِنْ مَآلُهُ إِلَى الْجَنَّةِ، مِنْ أَجْلِ حَسَنَةِ التَّوْحِيدِ، وَهَذَا يَدُلُّ عَلَى عَظِيمِ فَضْلِ التَّوْحِيدِ.</div><div class="bt-translit">Fa-man shahida bi-t-tawḥīd wa ʿamila bi-muqtaḍāhu bi-fiʿli ṭ-ṭāʿāti wa jtinābi l-kabāʾiri wa l-mūbiqāti dakhala l-jannah, wa man shahida bi-t-tawḥīdi wa waqaʿa minhu taqṣīrun fī l-ʿamali fa-huwa taḥta fatḥi l-mashīʾah, in shāʾa-llāhu ʿadhdhabahu wa in shāʾa ghafara lah, wa lākin maʾāluhu ilā l-jannah, min ajli ḥasanati t-tawḥīd, wa hādhā yadullu ʿalā ʿaẓīmi faḍli t-tawḥīd.</div><div class="bt-en">Whoever <strong>bears witness to tawhid</strong> and <strong>acts by its requirement</strong> — performing the obligations and avoiding major sins and destructive deeds — enters Paradise. Whoever bears witness to tawhid <strong>but falls short in deeds</strong> — he is <strong>under the will of Allah</strong>: if He wills He will punish him, and if He wills He will forgive him. <strong>But his ultimate destination is Paradise</strong>, because of the good deed of tawhid. <strong>This indicates the tremendous virtue of tawhid.</strong></div></div>

<div class="hadith"><div class="hadith-label">وَالدَّلِيلُ عَلَى هَذَا · Ḥadīth — ʿUbādah ibn aṣ-Ṣāmit</div><div class="h-ar">أَنَّ النَّبِيَّ ﷺ قَالَ: «مَنْ شَهِدَ أَنْ لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنَّ مُحَمَّدًا عَبْدُهُ وَرَسُولُهُ، وَأَنَّ عِيسَى عَبْدُ اللَّهِ وَرَسُولُهُ، وَكَلِمَتُهُ أَلْقَاهَا إِلَى مَرْيَمَ وَرُوحٌ مِنْهُ، وَالْجَنَّةُ حَقٌّ، وَالنَّارُ حَقٌّ، أَدْخَلَهُ اللَّهُ الْجَنَّةَ عَلَى مَا كَانَ مِنَ الْعَمَلِ»</div><div class="h-translit">Anna n-nabiyya ﷺ qāla: "Man shahida an lā ilāha illā-llāh waḥdahu lā sharīka lah, wa anna Muḥammadan ʿabduhu wa rasūluh, wa anna ʿĪsā ʿabdu-llāhi wa rasūluh, wa kalimatuhu alqāhā ilā Maryama wa rūḥun minh, wa l-jannatu ḥaqqun wa-n-nāru ḥaqq — adkhalahu-llāhu l-jannata ʿalā mā kāna mina l-ʿamal."</div><div class="h-en">The Prophet ﷺ said: <strong>"Whoever bears witness that there is no deity but Allah alone, without any partner, and that Muḥammad is His servant and messenger, and that ʿĪsā (Jesus) is Allah\u2019s servant and messenger — His word that He cast upon Maryam and a spirit from Him — and that Paradise is true and the Fire is true: Allah will admit him into Paradise, <em>whatever his deeds may have been</em>."</strong></div><div class="h-source">Narrated by al-Bukhārī no. 3435 and Muslim no. 28</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why does this hadith mention ʿĪsā (Jesus)?</span><div class="study-note-body">This hadith specifically mentions that you must also testify: <strong>ʿĪsā (Jesus) is a servant of Allah and His messenger</strong> — not the son of God, not God Himself. The extra description — "His <em>word</em> cast upon Maryam" — refers to Allah creating him by the word "Be!" sent via Jibrīl, not through a normal father. And "a spirit <em>from</em> Him" means an honored soul that Allah created. Christians make mistakes about Jesus. Islam respects ʿĪsā as one of the greatest prophets — but he was a <em>man</em> and a messenger, not divine. Getting this right is part of tawhid.</div></div>`;}

function L3P4(){return `
<div class="sec"><div class="sec-ar">تَحْقِيقُ التَّوْحِيدِ</div><div class="sec-translit">Taḥqīqu t-tawḥīd</div><div class="sec-en">The Realization of Tawhid</div></div>

<div class="body-text"><div class="bt-label">📖 Definition</div><div class="bt-ar">الْمُرَادُ بِتَحْقِيقِ التَّوْحِيدِ هُوَ: إِخْلَاصُ الْعَمَلِ لِلَّهِ تَعَالَى، وَتَخْلِيصُهُ مِنْ شَوَائِبِ الشِّرْكِ وَالْبِدَعِ وَالْمَعَاصِي، وَتَكْمِيلُهُ بِفِعْلِ السُّنَنِ وَتَرْكِ الْمَكْرُوهَاتِ.</div><div class="bt-translit">Al-murādu bi-taḥqīqi t-tawḥīdi huwa: ikhlāṣu l-ʿamali li-llāhi taʿālā, wa takhlīṣuhu min shawāʾibi sh-shirki wa l-bidaʿi wa l-maʿāṣī, wa takmīluhu bi-fiʿli s-sunani wa tarki l-makrūhāt.</div><div class="bt-en">The <strong>realization of tawhid</strong> means: <strong>sincere deeds for Allah alone</strong>, <strong>purifying them from the blemishes of shirk, innovations (bidʿah), and sins</strong>, and <strong>perfecting them by performing the sunnahs and abandoning what is disliked (makrūhāt)</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Think of tawhid like a clean white shirt</span><div class="study-note-body">Imagine tawhid as a clean white shirt. <em>Shirk</em> is like mud — it ruins the shirt completely. <em>Bidʿah</em> (invented religious practices) and <em>sins</em> are like smaller stains — they don\u2019t destroy the shirt, but they dirty it. <em>Taḥqīq</em> means: (1) keep the shirt clean from mud and stains, and (2) make it even brighter by doing extra good acts like Sunnah prayers. That\u2019s "realizing" or "perfecting" your tawhid.</div></div>

<div class="pillar-grid">
  <div class="pillar"><div class="pillar-n">1</div><div class="pillar-title">Sincere deeds for Allah alone</div><div class="pillar-ar">إِخْلَاصُ الْعَمَلِ لِلَّهِ</div><div class="pillar-translit">Ikhlāṣu l-ʿamali li-llāh</div></div>
  <div class="pillar"><div class="pillar-n">2</div><div class="pillar-title">Free from shirk, bidʿah & sins</div><div class="pillar-ar">تَخْلِيصُهُ مِنَ الشِّرْكِ وَالْبِدَعِ وَالْمَعَاصِي</div><div class="pillar-translit">Takhlīṣuhu min ash-shirki wa-l-bidaʿi wa-l-maʿāṣī</div></div>
  <div class="pillar"><div class="pillar-n">3</div><div class="pillar-title">Perfected by performing the sunan</div><div class="pillar-ar">تَكْمِيلُهُ بِفِعْلِ السُّنَنِ</div><div class="pillar-translit">Takmīluhu bi-fiʿli s-sunan</div></div>
  <div class="pillar"><div class="pillar-n">4</div><div class="pillar-title">Abandoning the makrūhāt</div><div class="pillar-ar">تَرْكُ الْمَكْرُوهَاتِ</div><div class="pillar-translit">Tarku l-makrūhāt</div></div>
</div>

<div class="assessment" id="as3p4"><div class="section-badge">التَّقْوِيم · Assessment</div><p class="assessment-intro" style="margin-top:8px">Attempt before revealing.</p><div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('as3p4'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('as3p4'))">Hide All</button></div>
<div class="q-item"><span class="q-num">1</span><div class="q-en">List three virtues of tawhid with evidence for each.</div><div class="q-ar">أُعَدِّدُ ثَلَاثًا مِنْ فَضَائِلِ التَّوْحِيدِ مَعَ الدَّلِيلِ.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">Any three from: (1) Security & guidance — Anʿām 6:82. (2) Allah will not punish monotheists — Bukhārī 2701. (3) Expiation of sins — Muslim 2687. (4) Heaviest on scale — Aḥmad 6583. (5) Entry into Paradise — Bukhārī 3435.</div></div>
<div class="q-item"><span class="q-num">2</span><div class="q-en">What is the meaning of ẓulm in: ﴿وَلَمْ يَلْبِسُوا إِيمَانَهُم بِظُلْمٍ﴾?</div><div class="q-ar">مَا تَفْسِيرُ الظُّلْمِ فِي الآيَةِ؟</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">Shirk — the Prophet ﷺ clarified this (Bukhārī 32) citing Luqmān 31:13: "Indeed, shirk is a grave injustice." So the verse promises security for those whose faith is free from shirk.</div></div></div>`;}

function L4P1(){return `
<div class="body-text"><div class="bt-label">📖 Textbook Opening</div><div class="bt-ar">مِنْ أَهَمِّ الْمُعْتَقَدَاتِ الَّتِي تُضَادُّ التَّوْحِيدَ مَا يَأْتِي:</div><div class="bt-translit">Min ahammi l-muʿtaqadāti llatī tuḍāddu t-tawḥīda mā yaʾtī:</div><div class="bt-en">Among the <strong>most important beliefs that contradict tawhid</strong> are the following:</div></div>

<div class="point"><div class="point-num">١</div><div class="point-body"><div class="point-ar">أَوَّلًا: عَدَمُ الْبَرَاءَةِ مِنْ كُلِّ مَا يُعْبَدُ مِنْ دُونِ اللَّهِ</div><div class="point-translit">Awwalan: ʿAdamu l-barāʾati min kulli mā yuʿbadu min dūni-llāh</div><div class="point-en">First: Failing to Disavow Everything Worshipped Besides Allah</div></div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">التَّوْحِيدُ الْخَالِصُ الَّذِي لَا يَقْبَلُ اللَّهُ تَعَالَى غَيْرَهُ لَا يَكُونُ إِلَّا بِإِخْلَاصِ الْعِبَادَةِ لِلَّهِ، وَالْبَرَاءَةِ مِنْ جَمِيعِ الْآلِهَةِ الْبَاطِلَةِ، فَلَا يَكْفِي فِي التَّوْحِيدِ مُجَرَّدُ التَّلَفُّظِ بِكَلِمَةِ (لَا إِلَهَ إِلَّا اللَّهُ)، بَلْ لَا بُدَّ أَنْ يُضَافَ إِلَيْهِ الْكُفْرُ بِمَا يُعْبَدُ مِنْ دُونِ اللَّهِ، وَالدَّلِيلُ عَلَى هَذَا:</div><div class="bt-translit">At-tawḥīdu l-khāliṣu lladhī lā yaqbalu-llāhu taʿālā ghayrahu lā yakūnu illā bi-ikhlāṣi l-ʿibādati li-llāh, wa l-barāʾati min jamīʿi l-ālihati l-bāṭilah, fa-lā yakfī fī t-tawḥīdi mujarradu t-talaffuẓi bi-kalimati (lā ilāha illā-llāh), bal lā budda an yuḍāfa ilayhi l-kufru bi-mā yuʿbadu min dūni-llāh, wa d-dalīlu ʿalā hādhā:</div><div class="bt-en">The <strong>pure tawhid — which Allah will accept nothing else in its place</strong> — cannot exist except through <strong>sincerity of worship to Allah</strong> AND <strong>disavowal of every false deity</strong>. It is <strong>not sufficient for tawhid to merely pronounce the words "Lā ilāha illā-llāh"</strong>; rather, <strong>disbelief in whatever is worshipped besides Allah</strong> must be added to it. The evidence for this:</div></div>

<div class="verse"><div class="v-ar">﴿وَإِذْ قَالَ إِبْرَاهِيمُ لِأَبِيهِ وَقَوْمِهِ إِنَّنِي بَرَاءٌ مِّمَّا تَعْبُدُونَ ۝ إِلَّا الَّذِي فَطَرَنِي فَإِنَّهُ سَيَهْدِينِ ۝ وَجَعَلَهَا كَلِمَةً بَاقِيَةً فِي عَقِبِهِ لَعَلَّهُمْ يَرْجِعُونَ﴾</div><div class="v-translit">Wa idh qāla Ibrāhīmu li-abīhi wa qawmih: innanī barāʾun mimmā taʿbudūn. Illā lladhī faṭaranī fa-innahu sa-yahdīn. Wa jaʿalahā kalimatan bāqiyatan fī ʿaqibihi laʿallahum yarjiʿūn.</div><div class="v-en">"When Ibrāhīm said to his father and his people: <strong>'Indeed, I am disassociated from what you worship — except for He who created me; for indeed, He will guide me.'</strong> And he made it a word <strong>remaining among his descendants</strong> that they might return."</div><div class="v-ref">Sūrat az-Zukhruf 43:26–28</div></div>

<div class="body-text"><div class="bt-label">📖 Word-by-Word from the Textbook</div><div class="bt-ar"><strong>الْمُرَادُ بِكَلِمَةِ التَّوْحِيدِ</strong> (لَا إِلَهَ إِلَّا اللَّهُ)<br><strong>بَرَاءٌ</strong>: تَارِكٌ وَمُبْتَعِدٌ<br><strong>فَطَرَنِي</strong>: خَلَقَنِي<br><strong>كَلِمَةً بَاقِيَةً فِي عَقِبِهِ</strong>: لَا يَزَالُ فِي ذُرِّيَّتِهِ مَنْ يَقُولُهَا</div><div class="bt-translit"><strong>Al-murādu bi-kalimati t-tawḥīd:</strong> (lā ilāha illā-llāh)<br><strong>Barāʾ:</strong> tārikun wa mubtaʿid (one who leaves and distances himself).<br><strong>Faṭaranī:</strong> khalaqanī (He created me).<br><strong>Kalimatan bāqiyatan fī ʿaqibih:</strong> lā yazālu fī dhurriyyatihi man yaqūluhā (there will always remain in his descendants those who say it).</div><div class="bt-en"><strong>What is meant by the "word of tawhid":</strong> "Lā ilāha illā-llāh" (there is no god but Allah).<br><strong>"Barāʾ" (disassociated):</strong> one who has left and distanced himself.<br><strong>"Faṭaranī":</strong> created me.<br><strong>"A word remaining among his descendants":</strong> there will always remain among his descendants those who say it.</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Explanation</div><div class="bt-ar">فَقَدْ تَبَرَّأَ إِبْرَاهِيمُ عَلَيْهِ الصَّلَاةُ وَالسَّلَامُ وَهُوَ إِمَامُ الْحُنَفَاءِ وَالْمُوَحِّدِينَ مِنْ جَمِيعِ الْآلِهَةِ الَّتِي تُعْبَدُ مِنْ دُونِ اللَّهِ تَعَالَى، ثُمَّ اسْتَثْنَى إِلَهًا وَاحِدًا فَقَطْ هُوَ اللَّهُ جَلَّ وَعَلَا، الَّذِي خَلَقَهُ وَأَوْجَدَهُ مِنَ الْعَدَمِ. فَفِي هَذِهِ الْآيَةِ الْكَرِيمَةِ تَفْسِيرُ التَّوْحِيدِ: حَيْثُ دَلَّتْ عَلَى أَنَّ حَقِيقَةَ التَّوْحِيدِ مُرَكَّبَةٌ مِنْ أَمْرَيْنِ:<br>الْأَوَّلُ: الْبَرَاءَةُ مِنْ كُلِّ الْآلِهَةِ الْبَاطِلَةِ الَّتِي يَعْبُدُهَا الْمُشْرِكُونَ مِنْ دُونِ اللَّهِ تَعَالَى.<br>الثَّانِي: إِثْبَاتُ الْعِبَادَةِ لِلَّهِ وَحْدَهُ لَا شَرِيكَ لَهُ.</div><div class="bt-translit">Fa-qad tabarraʾa Ibrāhīmu ʿalayhi ṣ-ṣalātu wa s-salāmu — wa huwa imāmu l-ḥunafāʾi wa l-muwaḥḥidīn — min jamīʿi l-ālihati llatī tuʿbadu min dūni-llāhi taʿālā, thumma-stathnā ilāhan wāḥidan faqaṭ huwa-llāhu jalla wa ʿalā, lladhī khalaqahu wa awjadahu mina l-ʿadam. Fa-fī hādhihi l-āyati l-karīmati tafsīru t-tawḥīd: ḥaythu dallat ʿalā anna ḥaqīqata t-tawḥīdi murakkabatun min amrayn:<br>Al-awwal: al-barāʾatu min kulli l-ālihati l-bāṭilati llatī yaʿbuduhā l-mushrikūna min dūni-llāhi taʿālā.<br>Ath-thānī: ithbātu l-ʿibādati li-llāhi waḥdahu lā sharīka lah.</div><div class="bt-en">Ibrāhīm ﷺ — <strong>imam of the ḥunafāʾ (true monotheists)</strong> — <strong>disavowed all deities worshipped besides Allah</strong>, then <strong>excepted only ONE deity</strong>: Allah — Majestic and Exalted — who <strong>created him and brought him into being from nothing</strong>. This noble verse <strong>explains tawhid</strong>: it shows that the <strong>reality of tawhid is composed of two matters</strong>:<br><strong>First:</strong> <strong>disavowal</strong> of all false deities worshipped by the polytheists besides Allah.<br><strong>Second:</strong> <strong>affirmation of worship to Allah alone</strong>, without any partner.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Ibrāhīm\u2019s powerful example</span><div class="study-note-body">Prophet Ibrāhīm (Abraham) ﷺ didn\u2019t just <em>quietly</em> not worship idols — he openly said to his father and community: "I am <strong>FREE</strong> from what you worship!" This word (<em>barāʾah</em> = disavowal) is strong. It\u2019s not shy. It\u2019s not "maybe we can agree to disagree." It\u2019s: "What you worship is wrong, and I want nothing to do with it." That\u2019s the courage of real tawhid — openly rejecting false gods while openly affirming Allah.</div></div>

<div class="point"><div class="point-num">٢</div><div class="point-body"><div class="point-ar">ثَانِيًا: دُعَاءُ غَيْرِ اللَّهِ تَعَالَى</div><div class="point-translit">Thāniyan: Duʿāʾu ghayri-llāhi taʿālā</div><div class="point-en">Second: Supplicating to Other Than Allah</div></div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">دُعَاءُ غَيْرِ اللَّهِ تَعَالَى وَالاِسْتِغَاثَةُ بِهِ يُنَاقِضُ التَّوْحِيدَ، وَذَلِكَ أَنَّ كُلَّ مَنْ دَعَا غَيْرَ اللَّهِ تَعَالَى مِنَ الْأَنْبِيَاءِ وَالصَّالِحِينَ وَغَيْرِهِمْ فَقَدْ وَقَعَ فِي الشِّرْكِ.</div><div class="bt-translit">Duʿāʾu ghayri-llāhi taʿālā wa l-istighāthatu bihi yunāqiḍu t-tawḥīd, wa dhālika anna kulla man daʿā ghayra-llāhi taʿālā mina l-anbiyāʾi wa ṣ-ṣāliḥīna wa ghayrihim fa-qad waqaʿa fī sh-shirk.</div><div class="bt-en"><strong>Supplicating to other than Allah — and seeking help from them — contradicts tawhid</strong>. Whoever calls upon anyone besides Allah — whether prophets, righteous people, or others — has <strong>fallen into shirk</strong>.</div></div>

<div class="verse"><div class="v-ar">﴿قُلِ ادْعُوا الَّذِينَ زَعَمْتُم مِّن دُونِهِ فَلَا يَمْلِكُونَ كَشْفَ الضُّرِّ عَنكُمْ وَلَا تَحْوِيلًا ۝ أُولَٰئِكَ الَّذِينَ يَدْعُونَ يَبْتَغُونَ إِلَىٰ رَبِّهِمُ الْوَسِيلَةَ أَيُّهُمْ أَقْرَبُ وَيَرْجُونَ رَحْمَتَهُ وَيَخَافُونَ عَذَابَهُ ۚ إِنَّ عَذَابَ رَبِّكَ كَانَ مَحْذُورًا﴾</div><div class="v-translit">Quli dʿū alladhīna zaʿamtum min dūnihi fa-lā yamlikūna kashfa ḍ-ḍurri ʿankum wa lā taḥwīlā. Ulāʾika lladhīna yadʿūna yabtaghūna ilā rabbihimu l-wasīlata ayyuhum aqrab wa yarjūna raḥmatahu wa yakhāfūna ʿadhābah. Inna ʿadhāba rabbika kāna maḥdhūrā.</div><div class="v-en">"Say: <strong>Call upon those you have claimed besides Him — they cannot remove harm from you or shift it</strong>. <strong>Those they call upon</strong> [themselves] <strong>seek the means of access to their Lord</strong>, [striving as to] which of them would be nearest, and they hope for His mercy and fear His punishment. Indeed, the punishment of your Lord is ever feared."</div><div class="v-ref">Sūrat al-Isrāʾ 17:56–57</div></div>

<div class="body-text"><div class="bt-label">📖 Meaning of the Two Verses</div><div class="bt-ar">وَمَعْنَى الْآيَتَيْنِ الْكَرِيمَتَيْنِ:<br>أ. هَؤُلَاءِ الَّذِينَ يَدْعُوهُمُ الْمُشْرِكُونَ مِنْ دُونِ اللَّهِ تَعَالَى لَا يَمْلِكُونَ كَشْفَ الضُّرِّ عَنْهُمْ وَهُوَ رَفْعُهُ بِالْكُلِّيَّةِ، كَمَا لَا يَمْلِكُونَ تَحْوِيلَ هَذَا الضُّرِّ عَنْهُمْ إِلَى غَيْرِهِمْ، وَهَذَا دَلِيلٌ عَلَى ضَعْفِهِمْ، وَعَجْزِهِمْ، وَعَدَمِ صَلَاحِيَّتِهِمْ لِلتَّوَجُّهِ إِلَيْهِمْ بِالدُّعَاءِ مِنْ دُونِ اللَّهِ تَعَالَى.<br>ب. هَؤُلَاءِ الَّذِينَ يَدْعُوهُمُ الْمُشْرِكُونَ مِنْ دُونِ اللَّهِ مِثْلَ: الْمَلَائِكَةِ، أَوِ الْأَنْبِيَاءِ أَوِ الصَّالِحِينَ أَوْ غَيْرِهِمْ؛ هُمْ يَتَقَرَّبُونَ إِلَيْهِ سُبْحَانَهُ وَتَعَالَى بِالْأَعْمَالِ الصَّالِحَةِ، يَرْجُونَ بِذَلِكَ رَحْمَتَهُ، وَيَخَافُونَ عَذَابَهُ، فَكَانَ الْوَاجِبُ عَلَيْكُمْ: أَنْ تَفْعَلُوا كَمَا فَعَلُوا، فَتَتَقَرَّبُوا إِلَى اللَّهِ تَعَالَى وَتَدْعُوهُ وَحْدَهُ لَا شَرِيكَ لَهُ.</div><div class="bt-translit">Wa maʿnā l-āyatayni l-karīmatayn:<br>A. Hāʾulāʾi lladhīna yadʿūhumu l-mushrikūna min dūni-llāhi taʿālā lā yamlikūna kashfa ḍ-ḍurri ʿanhum wa huwa rafʿuhu bi-l-kulliyyah, kamā lā yamlikūna taḥwīla hādhā ḍ-ḍurri ʿanhum ilā ghayrihim, wa hādhā dalīlun ʿalā ḍaʿfihim, wa ʿajzihim, wa ʿadami ṣalāḥiyyatihim li-t-tawajjuhi ilayhim bi-d-duʿāʾi min dūni-llāhi taʿālā.<br>B. Hāʾulāʾi lladhīna yadʿūhumu l-mushrikūna min dūni-llāhi mithla: al-malāʾikah, aw al-anbiyāʾ aw aṣ-ṣāliḥīn aw ghayrihim; hum yataqarrabūna ilayhi subḥānahu wa taʿālā bi-l-aʿmāli ṣ-ṣāliḥah, yarjūna bi-dhālika raḥmatah, wa yakhāfūna ʿadhābah, fa-kāna l-wājibu ʿalaykum: an tafʿalū kamā faʿalū, fa-tataqarrabū ilā-llāhi taʿālā wa tadʿūhu waḥdahu lā sharīka lah.</div><div class="bt-en"><strong>(a)</strong> Those whom the polytheists call upon besides Allah <strong>cannot remove harm</strong> from them (which is <em>lifting it entirely</em>), nor can they <strong>transfer this harm to others</strong>. This is proof of their <strong>weakness, incapacity, and unsuitability</strong> for being turned to in supplication besides Allah.<br><strong>(b)</strong> Those whom the polytheists call upon besides Allah — such as <strong>the angels, prophets, righteous people,</strong> etc. — <strong>themselves seek nearness to Allah through good deeds</strong>, hoping for His mercy and fearing His punishment. So the obligation upon you is: <strong>to do as they do</strong> — to seek nearness to Allah and call upon Him alone, with no partner.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Simple explanation</span><div class="study-note-body">Some people pray to saints, angels, or dead righteous people thinking "they\u2019re closer to Allah, they\u2019ll help me." But Allah explains in this verse: <strong>those beings are themselves asking Allah for mercy!</strong> They\u2019re like you and me — they also need Allah. You don\u2019t call a waiter to feed you when the chef himself is right there listening. Go <em>directly</em> to Allah — He hears you perfectly and loves when you ask Him.</div></div>`;}

<div class="point"><div class="point-num">٣</div><div class="point-body"><div class="point-ar">ثَالِثًا: مَحَبَّةُ غَيْرِ اللَّهِ كَمَحَبَّةِ اللَّهِ</div><div class="point-translit">Thālithan: Maḥabbatu ghayri-llāhi ka-maḥabbati-llāh</div><div class="point-en">Third: Loving Other Than Allah as One Loves Allah</div></div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">مَنْ أَحَبَّ غَيْرَ اللَّهِ تَعَالَى كَمَحَبَّتِهِ لِلَّهِ تَعَالَى فَقَدِ اتَّخَذَهُ نِدًّا لِلَّهِ، وَوَقَعَ فِي الشِّرْكِ الْأَكْبَرِ، قَالَ اللَّهُ تَعَالَى:</div><div class="bt-translit">Man aḥabba ghayra-llāhi taʿālā ka-maḥabbatihi li-llāhi taʿālā fa-qad ittakhadhahu niddan li-llāh, wa waqaʿa fī sh-shirki l-akbar, qāla-llāhu taʿālā:</div><div class="bt-en">Whoever loves other than Allah <strong>with the same love he has for Allah</strong> has <strong>taken him as a rival (nidd) to Allah</strong>, and has <strong>fallen into major shirk</strong>. Allah — Exalted — said:</div></div>

<div class="verse"><div class="v-ar">﴿وَمِنَ النَّاسِ مَن يَتَّخِذُ مِن دُونِ اللَّهِ أَندَادًا يُحِبُّونَهُمْ كَحُبِّ اللَّهِ ۖ وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِّلَّهِ﴾</div><div class="v-translit">Wa mina n-nāsi man yattakhidhu min dūni-llāhi andādan yuḥibbūnahum ka-ḥubbi-llāh. Wa lladhīna āmanū ashaddu ḥubban li-llāh.</div><div class="v-en">"And among the people are those who <strong>take equals (andād) alongside Allah</strong>, <strong>loving them as they love Allah</strong>. But those who believe are <strong>stronger in love for Allah</strong>."</div><div class="v-ref">Sūrat al-Baqarah 2:165</div></div>

<div class="body-text"><div class="bt-ar">فَدَلَّتِ الْآيَةُ الْكَرِيمَةُ عَلَى أَنَّ الْحُبَّ الْمُقْتَضِيَ لِلذُّلِّ وَالْخُضُوعِ يَجِبُ أَنْ يَكُونَ لِلَّهِ تَعَالَى، وَلِهَذَا وَصَفَ اللَّهُ تَعَالَى عِبَادَهُ الْمُؤْمِنِينَ بِزِيَادَةِ مَحَبَّتِهِ عَلَى غَيْرِهِ، فَقَالَ: ﴿وَالَّذِينَ آمَنُوا أَشَدُّ حُبًّا لِلَّهِ﴾، فَمَنْ أَحَبَّ غَيْرَ اللَّهِ كَمَا يُحِبُّ اللَّهَ فَقَدْ وَقَعَ فِي (شِرْكِ الْمَحَبَّةِ).</div><div class="bt-translit">Fa-dallati l-āyatu l-karīmatu ʿalā anna l-ḥubba l-muqtaḍiya li-dh-dhulli wa l-khuḍūʿi yajibu an yakūna li-llāhi taʿālā, wa li-hādhā waṣafa-llāhu taʿālā ʿibādahu l-muʾminīna bi-ziyādati maḥabbatihi ʿalā ghayrih, fa-qāla: ﴿wa lladhīna āmanū ashaddu ḥubban li-llāh﴾, fa-man aḥabba ghayra-llāhi kamā yuḥibbu-llāha fa-qad waqaʿa fī (shirki l-maḥabbah).</div><div class="bt-en">The noble verse indicates that <strong>the love which entails humility and submission must be only for Allah</strong>. That is why Allah describes His believing servants as having <strong>greater love for Him than for others</strong>, saying: <em>"Those who believe are stronger in love for Allah."</em> Whoever loves another as he loves Allah has fallen into <strong>"shirk of love" (shirk al-maḥabbah)</strong>.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Wait — isn't it OK to love my family?</span><div class="study-note-body">Yes of course! Islam encourages love for family, kindness to friends, and obedience to parents and teachers in good things. The problem is only when you love someone or something <em>as much as or more than Allah</em>, or obey someone in <em>disobedience to Allah</em>. Example: a friend tells you to skip prayer — obeying them in <em>that</em> would be shirk, because you\u2019re putting their command above Allah\u2019s command. But helping your friend with homework? That\u2019s just being kind — not shirk at all.</div></div>

<div class="activity" id="al4p2a"><div class="section-badge">نَشَاط ١ · Activity 1</div>
<div class="act-item"><div class="act-prompt"><strong style="color:var(--teal)">قَالَ اللَّهُ تَعَالَى مُبَيِّنًا مَا يَقُولُهُ الْمُشْرِكُونَ فِي النَّارِ: ﴿تَاللَّهِ إِن كُنَّا لَفِي ضَلَالٍ مُّبِينٍ ۝ إِذْ نُسَوِّيكُم بِرَبِّ الْعَالَمِينَ﴾</strong><br><em style="color:var(--muted);font-size:.82rem">Qāla-llāhu taʿālā mubayyinan mā yaqūluhu l-mushrikūna fī n-nār: "Ta-llāhi in kunnā la-fī ḍalālin mubīn, idh nusawwīkum bi-rabbi l-ʿālamīn."</em><br>Allah — Exalted — said, describing what the polytheists will say in the Fire: "By Allah, we were indeed in manifest error when we equated you with the Lord of all the worlds!" (ash-Shuʿarāʾ 26:97–98)<br><br><strong>مَا عَلَاقَةُ الْآيَاتِ بِمَحَبَّةِ غَيْرِ اللَّهِ؟</strong> / What is the relation of these verses to loving other than Allah?</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">The polytheists in the Fire confess their error: they had <strong>equated (nusawwīkum)</strong> their false deities with Allah in love, devotion, and worship. Loving others as one loves Allah is exactly this ẓulm — making them rivals (andād) to the Lord of all worlds.</div></div></div>

<div class="point"><div class="point-num">٤</div><div class="point-body"><div class="point-ar">رَابِعًا: طَاعَةُ غَيْرِ اللَّهِ فِي تَحْلِيلِ الْحَرَامِ أَوْ تَحْرِيمِ الْحَلَالِ</div><div class="point-translit">Rābiʿan: Ṭāʿatu ghayri-llāhi fī taḥlīli l-ḥarāmi aw taḥrīmi l-ḥalāl</div><div class="point-en">Fourth: Obeying Others in Making the Forbidden Lawful or the Lawful Forbidden</div></div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">التَّشْرِيعُ حَقٌّ لِلَّهِ تَعَالَى، فَلَا يَجُوزُ طَاعَةُ أَحَدٍ فِي تَحْلِيلِ مَا حَرَّمَ اللَّهُ، وَلَا فِي تَحْرِيمِ مَا أَحَلَّ اللَّهُ تَعَالَى، سَوَاءٌ أَكَانَ مِنَ الْعُلَمَاءِ، أَوْ رُؤَسَاءِ الْقَبَائِلِ أَوْ غَيْرِهِمْ؛ فَإِنْ أَطَاعَهُمْ مَعَ عِلْمِهِ بِأَنَّهُ مُخَالِفٌ لِحُكْمِ اللَّهِ فَإِنَّ ذَلِكَ مِنَ اتِّخَاذِهِمْ آلِهَةً مِنْ دُونِ اللَّهِ عَزَّ وَجَلَّ، وَهَذَا مِنَ الشِّرْكِ الْأَكْبَرِ، وَيُسَمَّى هَذَا النَّوْعُ مِنَ الشِّرْكِ: (شِرْكُ الطَّاعَةِ).</div><div class="bt-translit">At-tashrīʿu ḥaqqun li-llāhi taʿālā, fa-lā yajūzu ṭāʿatu aḥadin fī taḥlīli mā ḥarrama-llāh, wa lā fī taḥrīmi mā aḥalla-llāhu taʿālā, sawāʾun a-kāna mina l-ʿulamāʾ, aw ruʾasāʾi l-qabāʾili aw ghayrihim; fa-in aṭāʿahum maʿa ʿilmihi bi-annahu mukhālifun li-ḥukmi-llāhi fa-inna dhālika mina ttikhādhihim ālihatan min dūni-llāhi ʿazza wa jall, wa hādhā mina sh-shirki l-akbar, wa yusammā hādhā n-nawʿu mina sh-shirk: (shirku ṭ-ṭāʿah).</div><div class="bt-en"><strong>Legislation is Allah\u2019s right alone</strong>. It is <strong>not permitted to obey anyone</strong> in <strong>making lawful what Allah has forbidden</strong>, nor in <strong>making forbidden what Allah has made lawful</strong> — whether they are scholars, tribal leaders, or anyone else. If someone obeys them <strong>knowing it contradicts Allah\u2019s ruling</strong>, that counts as <strong>taking them as deities besides Allah</strong> — and this is <strong>major shirk</strong>. This type of shirk is called <strong>"shirk of obedience" (shirk aṭ-ṭāʿah)</strong>.</div></div>

<div class="verse"><div class="v-ar">﴿وَلَا تَقُولُوا لِمَا تَصِفُ أَلْسِنَتُكُمُ الْكَذِبَ هَٰذَا حَلَالٌ وَهَٰذَا حَرَامٌ لِّتَفْتَرُوا عَلَى اللَّهِ الْكَذِبَ ۚ إِنَّ الَّذِينَ يَفْتَرُونَ عَلَى اللَّهِ الْكَذِبَ لَا يُفْلِحُونَ﴾</div><div class="v-translit">Wa lā taqūlū li-mā taṣifu alsinatukumu l-kadhiba hādhā ḥalālun wa hādhā ḥarāmun li-taftarū ʿalā-llāhi l-kadhib. Inna lladhīna yaftarūna ʿalā-llāhi l-kadhiba lā yufliḥūn.</div><div class="v-en">"And <strong>do not say</strong> about what your tongues falsely describe: <strong>'This is lawful and this is forbidden'</strong> — to fabricate lies about Allah. Indeed, <strong>those who fabricate lies about Allah will not succeed</strong>."</div><div class="v-ref">Sūrat an-Naḥl 16:116</div></div>

<div class="activity" id="al4p2b"><div class="section-badge">نَشَاط ٢ · Activity 2</div>
<div class="act-item"><div class="act-prompt"><strong style="color:var(--teal)">(عِبَادَةُ اللَّهِ تَعَالَى لَا تَصِحُّ إِلَّا بِالْكُفْرِ بِالطَّاغُوتِ)<br>أَذْكُرْ دَلِيلًا مِنَ الْقُرْآنِ الْكَرِيمِ يَدُلُّ عَلَى هَذَا الْحُكْمِ.</strong><br><em style="color:var(--muted);font-size:.82rem">(ʿIbādatu-llāhi taʿālā lā taṣiḥḥu illā bi-l-kufri bi-ṭ-ṭāghūt) — Adhkur dalīlan mina l-qurʾāni l-karīmi yadullu ʿalā hādhā l-ḥukm.</em><br><strong>"Worship of Allah is not valid except through disbelief in Ṭāghūt (false deities)."</strong> Mention an evidence from the Noble Qur\u2019an that indicates this ruling.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box"><strong>﴿وَلَقَدْ بَعَثْنَا فِي كُلِّ أُمَّةٍ رَّسُولًا أَنِ اعْبُدُوا اللَّهَ وَاجْتَنِبُوا الطَّاغُوتَ﴾</strong> — Sūrat an-Naḥl 16:36. <br><strong>Worship of Allah</strong> and <strong>rejection/avoidance of Ṭāghūt</strong> are joined as a single command — one without the other is not valid tawhid.</div></div></div>`;}

function L5P1(){return `
<div class="sec"><div class="sec-ar">الْمُرَادُ بِالشَّهَادَتَيْنِ</div><div class="sec-translit">Al-murādu bi-sh-shahādatayn</div><div class="sec-en">What the Two Testimonies Mean</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">الشَّهَادَتَانِ هُمَا قَوْلُ: (أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، وَأَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ).<br>مَعْنَى الشَّهَادَةِ: الْإِقْرَارُ وَالاِعْتِرَافُ.</div><div class="bt-translit">Ash-shahādatāni humā qawlu: (Ashhadu an lā ilāha illā-llāh, wa ashhadu anna Muḥammadan rasūlu-llāh).<br>Maʿnā sh-shahādah: al-iqrāru wa l-iʿtirāf.</div><div class="bt-en">The two testimonies are the saying of: <strong>"I bear witness that there is no deity worthy of worship except Allah, and I bear witness that Muḥammad is the Messenger of Allah."</strong><br>The meaning of <em>shahādah</em> (testimony/witnessing): <strong>acknowledgement and admission</strong> (al-iqrāru wa l-iʿtirāf).</div></div>

<div class="sec"><div class="sec-ar">مَكَانَةُ الشَّهَادَتَيْنِ</div><div class="sec-translit">Makānatu sh-shahādatayn</div><div class="sec-en">The Standing of the Two Testimonies</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">١. الشَّهَادَتَانِ هُمَا الرُّكْنُ الْأَوَّلُ مِنْ أَرْكَانِ الْإِسْلَامِ، فَهُمَا أَوَّلُ مَا يَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِي الْإِسْلَامِ قَوْلُهُ، وَلَا يَصِحُّ إِسْلَامُ أَحَدٍ لَمْ يَشْهَدْ بِهِمَا إِذَا كَانَ قَادِرًا عَلَى النُّطْقِ بِهَا.<br>٢. لَا يَقْبَلُ اللَّهُ عَمَلَ أَحَدٍ مِنْ صَلَاةٍ، أَوْ زَكَاةٍ، أَوْ حَجٍّ أَوْ غَيْرِهَا مِنْ أَعْمَالِ الْبِرِّ حَتَّى يَنْطِقَ بِالشَّهَادَتَيْنِ، فَالْإِسْلَامُ شَرْطٌ لِقَبُولِ كُلِّ عَمَلٍ.</div><div class="bt-translit">1. Ash-shahādatāni humā r-ruknu l-awwalu min arkāni l-islām, fa-humā awwalu mā yajibu ʿalā man arāda d-dukhūla fī l-islāmi qawluh, wa lā yaṣiḥḥu islāmu aḥadin lam yashhad bihimā idhā kāna qādiran ʿalā n-nuṭqi bihā.<br>2. Lā yaqbalu-llāhu ʿamala aḥadin min ṣalātin, aw zakātin, aw ḥajjin aw ghayrihā min aʿmāli l-birri ḥattā yanṭiqa bi-sh-shahādatayn, fa-l-islāmu sharṭun li-qabūli kulli ʿamal.</div><div class="bt-en">1. The two testimonies are <strong>the first pillar of Islam</strong>. They are the first thing required from anyone who wants to enter Islam; the Islam of someone who has not testified to them — while capable of pronouncing them — is <strong>not valid</strong>.<br>2. <strong>Allah does not accept any deed</strong> from anyone — prayer, zakāh, ḥajj, or any other acts of piety — <strong>until he pronounces the two testimonies</strong>. Islam is a <strong>condition for the acceptance of every deed</strong>.</div></div>

<div class="sec"><div class="sec-ar">حُكْمُ النُّطْقِ بِالشَّهَادَتَيْنِ</div><div class="sec-translit">Ḥukmu n-nuṭqi bi-sh-shahādatayn</div><div class="sec-en">The Ruling on Pronouncing the Two Testimonies</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">يَجِبُ عَلَى مَنْ أَرَادَ الدُّخُولَ فِي الْإِسْلَامِ النُّطْقُ بِالشَّهَادَتَيْنِ؛ لِأَنَّهُ لَا يَصِحُّ إِسْلَامُ شَخْصٍ بِمُجَرَّدِ اعْتِقَادِ مَعْنَاهُمَا دُونَ النُّطْقِ بِهِمَا، مَا لَمْ يُوجَدْ مَانِعٌ يَمْنَعُهُ، كَالْخَرَسِ. وَالدَّلِيلُ عَلَى هَذَا: حَدِيثُ ابْنِ عُمَرَ رَضِيَ اللَّهُ عَنْهُمَا، قَالَ رَسُولُ اللَّهِ ﷺ:</div><div class="bt-translit">Yajibu ʿalā man arāda d-dukhūla fī l-islāmi n-nuṭqu bi-sh-shahādatayn; li-annahu lā yaṣiḥḥu islāmu shakhṣin bi-mujarradi iʿtiqādi maʿnāhumā dūna n-nuṭqi bihimā, mā lam yūjad māniʿun yamnaʿuh, ka-l-kharas. Wa d-dalīlu ʿalā hādhā: ḥadīthu bni ʿUmar raḍiya-llāhu ʿanhumā, qāla rasūlu-llāhi ﷺ:</div><div class="bt-en">It is <strong>obligatory</strong> for whoever wants to enter Islam to <strong>pronounce the two testimonies</strong>, because the Islam of a person is not valid by merely believing their meaning without pronouncing them — unless there is an <strong>impediment preventing him</strong>, such as <strong>muteness (kharas)</strong>. The evidence for this: the ḥadīth of Ibn ʿUmar ﷺ — the Messenger of Allah ﷺ said:</div></div>

<div class="hadith"><div class="hadith-label">وَدَلِيلُ ذَلِكَ · Ibn ʿUmar — Bukhārī no. 25</div><div class="h-ar">«الْإِسْلَامُ أَنْ تَشْهَدَ أَنْ لَا إِلَهَ إِلَّا اللَّهُ وَأَنَّ مُحَمَّدًا رَسُولُ اللَّهِ»</div><div class="h-translit">Al-islāmu an tashhada an lā ilāha illā-llāh wa anna Muḥammadan rasūlu-llāh.</div><div class="h-en">"Islam is that you <strong>bear witness that there is no deity but Allah</strong> and that <strong>Muḥammad is the Messenger of Allah</strong>."</div><div class="h-source">Narrated by al-Bukhārī no. 25</div></div>

<div class="callout"><div class="callout-label">📌 Key Term: الشَّهَادَةُ · Ash-Shahādah</div><div class="callout-ar">الشَّهَادَةُ: الْإِقْرَارُ وَالِاعْتِرَافُ.</div><div class="callout-translit">Ash-shahādah: al-iqrāru wa l-iʿtirāf.</div><div class="callout-en">The testimony — meaning: <strong>acknowledgement and admission</strong>. It is not a blind recitation; it requires inner conviction and outward proclamation.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Word root: شَهِدَ</span><div class="study-note-body">The Arabic root <strong>ش-هـ-د (sh-h-d)</strong> means "to witness" or "to be present." <em>Shahādah</em> comes from <em>shāhid</em> (شَاهِد) — a witness. So saying the shahādah is not just "repeating words" — it's declaring yourself a <strong>witness</strong>, like in a courtroom, saying: "I have seen this truth and I testify to it."<br>Related words: <em>mashhadī</em> (scene), <em>shahīd</em> (martyr — one who witnesses with their life).</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why is Islam not valid without the two testimonies?</span><div class="study-note-body">Think of entering a country — there's a <em>passport check</em>. The two testimonies are like your spiritual passport into Islam. You might have the right intentions, the right feelings — but until you <strong>declare them</strong>, the door isn't officially open. And Allah doesn't accept any deed — prayer, fasting, charity — from someone who hasn't entered through this door. One exception: someone physically unable to speak (مَخْرَس — mute) — Allah is merciful and does not burden a soul beyond what it can bear.</div></div>`;}
function L5P2(){return `
<div class="sec"><div class="sec-ar">مَعْنَى أَشْهَدُ أَنْ (لَا إِلَهَ إِلَّا اللَّهُ)</div><div class="sec-translit">Maʿnā ashhadu an (lā ilāha illā-llāh)</div><div class="sec-en">The Meaning of "I Testify there is No God but Allah"</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">مَعْنَى أَشْهَدُ أَنْ (لَا إِلَهَ إِلَّا اللَّهُ): أُقِرُّ وَأَعْتَرِفُ وَأُوقِنُ أَنَّهُ لَا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ تَعَالَى وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنْفِي وَأُبْطِلُ كُلَّ مَعْبُودٍ سِوَاهُ.</div><div class="bt-translit">Maʿnā ashhadu an (lā ilāha illā-llāh): Uqirru wa aʿtarifu wa ūqinu annahu lā maʿbūda bi-ḥaqqin illā-llāhu taʿālā waḥdahu lā sharīka lah, wa anfī wa ubṭilu kulla maʿbūdin siwāh.</div><div class="bt-en">The meaning: I <strong>acknowledge, admit, and am certain</strong> that there is <strong>no deity worthy of worship by right except Allah</strong> — alone, with no partner — and I <strong>negate and invalidate every other deity besides Him</strong>.</div></div>

<div class="sec"><div class="sec-ar">أَرْكَانُ شَهَادَةِ أَنْ (لَا إِلَهَ إِلَّا اللَّهُ)</div><div class="sec-translit">Arkānu shahādati an (lā ilāha illā-llāh)</div><div class="sec-en">The Two Pillars of the Testimony</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">لِشَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ رُكْنَانِ هُمَا:</div><div class="bt-translit">Li-shahādati an lā ilāha illā-llāhu rukānāni humā:</div><div class="bt-en">The testimony has <strong>two pillars</strong>:</div></div>

<div class="body-text"><div class="bt-label">الرُّكْنُ الْأَوَّلُ — First Pillar</div><div class="bt-ar">الرُّكْنُ الْأَوَّلُ: النَّفْيُ. وَهُوَ فِي جُزْئِهَا الْأَوَّلِ، وَهُوَ قَوْلُنَا: «لَا إِلَهَ»، وَالْمَعْنَى: نَفْيُ صِحَّةِ جَمِيعِ الْمَعْبُودَاتِ الَّتِي تُعْبَدُ مِنْ دُونِ اللَّهِ تَعَالَى.</div><div class="bt-translit">Ar-ruknu l-awwal: an-nafī. Wa huwa fī juzʾihā l-awwal, wa huwa qawlunā: "lā ilāh", wa l-maʿnā: nafyu ṣiḥḥati jamīʿi l-maʿbūdāti llatī tuʿbadu min dūni-llāh.</div><div class="bt-en"><strong>First Pillar: Negation (an-nafī).</strong> Our saying <strong>"lā ilāh"</strong>. Meaning: <strong>negating the validity of all deities</strong> worshipped besides Allah.</div></div>

<div class="body-text"><div class="bt-label">الرُّكْنُ الثَّانِي — Second Pillar</div><div class="bt-ar">الرُّكْنُ الثَّانِي: الْإِثْبَاتُ. وَهُوَ فِي جُزْئِهَا الثَّانِي، وَهُوَ قَوْلُنَا: «إِلَّا اللَّهُ»، وَالْمَعْنَى: أُثْبِتُ مَعْبُودًا وَاحِدًا بِحَقٍّ، وَهُوَ اللَّهُ تَعَالَى.</div><div class="bt-translit">Ar-ruknu th-thānī: al-ithbāt. Wa huwa fī juzʾihā th-thānī, wa huwa qawlunā: "illā-llāh", wa l-maʿnā: uthibitu maʿbūdan wāḥidan bi-ḥaqq, wa huwa-llāhu taʿālā.</div><div class="bt-en"><strong>Second Pillar: Affirmation (al-ithbāt).</strong> Our saying <strong>"illā-llāh"</strong>. Meaning: <strong>affirming one true deity by right</strong> — Allah — Exalted.</div></div>

<div class="verse"><div class="v-ar">﴿وَاعْبُدُوا اللَّهَ وَلَا تُشْرِكُوا بِهِ شَيْئًا﴾</div><div class="v-translit">Wa-ʿbudū-llāha wa lā tushrikū bihi shayʾā.</div><div class="v-en">"Worship Allah and associate nothing with Him."</div><div class="v-ref">Sūrat an-Nisāʾ 4:36</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Explanation</div><div class="bt-ar">فَفِي قَوْلِهِ: ﴿وَلَا تُشْرِكُوا﴾ نَفْيٌ بِمَعْنَى «لَا إِلَهَ» فَتَنْتَفِي جَمِيعُ الْآلِهَةِ الْبَاطِلَةِ.<br>وَفِي قَوْلِهِ: ﴿وَاعْبُدُوا اللَّهَ﴾ إِثْبَاتٌ بِمَعْنَى «إِلَّا اللَّهُ» فَتَثْبُتُ الْأُلُوهِيَّةُ الْحَقَّةُ لِلَّهِ وَحْدَهُ.<br>وَقَوْلُهُ: ﴿شَيْئًا﴾ نَكِرَةٌ فِي سِيَاقِ النَّهْيِ فَتَعُمُّ كُلَّ شَيْءٍ، لَا نَبِيًّا، وَلَا وَلِيًّا، وَلَا صَالِحًا، وَلَا قَبْرًا، وَلَا ضَرِيحًا وَلَا غَيْرَهَا.</div><div class="bt-translit">Fa-fī qawlihi ﴿wa lā tushrikū﴾ nafyun bi-maʿnā "lā ilāh" — all false deities negated.<br>Wa fī qawlihi ﴿wa-ʿbudū-llāh﴾ ithbātun bi-maʿnā "illā-llāh" — true divinity affirmed for Allah alone.<br>Wa qawluhu ﴿shayʾan﴾ nakiratun fī siyāqi n-nahyi fa-taʿummu kulla shayʾ, lā nabiyyan, wa lā waliyyan, wa lā ṣāliḥan, wa lā qabran, wa lā ḍarīḥan.</div><div class="bt-en">In <strong>﴿wa lā tushrikū﴾</strong>: negation — <strong>all false deities are negated</strong>.<br>In <strong>﴿wa-ʿbudū-llāh﴾</strong>: affirmation — <strong>true divinity is for Allah alone</strong>.<br><strong>﴿shayʾan﴾</strong> — indefinite in a prohibition context — negates <strong>everything</strong>: no prophet, no saint, no grave, no shrine, nothing else.</div></div>

<div class="callout"><div class="callout-label">📌 Key Terms: النَّفْيُ · الإِثْبَاتُ</div><div class="callout-ar">النَّفْيُ: نَفْيُ صِحَّةِ الْعِبَادَةِ لِكُلِّ مَعْبُودٍ سِوَى اللَّهِ. — الإِثْبَاتُ: إِثْبَاتُ الْعِبَادَةِ لِلَّهِ وَحْدَهُ.</div><div class="callout-translit">An-nafī: nafyu ṣiḥḥati l-ʿibādati li-kulli maʿbūdin siwā-llāh. — Al-ithbāt: ithbātu l-ʿibādati li-llāhi waḥdah.</div><div class="callout-en"><strong>An-nafī (Negation):</strong> negating the validity of worship for every deity besides Allah.<br><strong>Al-ithbāt (Affirmation):</strong> affirming worship for Allah alone.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Grammar note: نَكِرَة في سياق النَّهي</span><div class="study-note-body">The textbook says ﴿شَيْئًا﴾ is a <strong>nakirah (indefinite noun) in a context of prohibition (siyāq an-nahyi)</strong>. In Arabic grammar, an indefinite noun in a prohibition context gives <strong>general/universal meaning</strong>. So when Allah says "do not associate <em>anything</em>" — the word "anything" (شَيْئًا) covers <em>every possible thing</em> without exception. This is why shirk of any kind — even a tiny bit — is completely forbidden. Not 99% tawhid; it has to be 100%.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 The Two Pillars — an easy way to remember</span><div class="study-note-body">The two pillars of "lā ilāha illā-llāh" are like a balance scale:<br>— <strong>Left side (نَفْي):</strong> you sweep off all false gods — "No god…"<br>— <strong>Right side (إِثْبَات):</strong> you place Allah on the scale — "…except Allah."<br>Both sides must be present and equal. If you only say "no god exists" without affirming Allah — that's denial. If you say "I worship Allah" while still bowing to something else — that's shirk. The scale must be <strong>perfectly balanced</strong>: clear rejection of all falsehood + clear affirmation of Allah alone.</div></div>`;}
function L5P3(){return `
<div class="sec"><div class="sec-ar">شُرُوطُ شَهَادَةِ أَنْ (لَا إِلَهَ إِلَّا اللَّهُ)</div><div class="sec-translit">Shurūṭu shahādati an (lā ilāha illā-llāh)</div><div class="sec-en">The Seven Conditions of "Lā ilāha illā-llāh"</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">لِشَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ سَبْعَةُ شُرُوطٍ، يَجِبُ اجْتِمَاعُهَا فِي كُلِّ مُسْلِمٍ، وَهِيَ:</div><div class="bt-translit">Li-shahādati an lā ilāha illā-llāhu sabʿatu shurūṭin, yajibu jtimāʿuhā fī kulli muslim, wa hiya:</div><div class="bt-en">The testimony "lā ilāha illā-llāh" has <strong>seven conditions</strong> which must all be present in every Muslim:</div></div>

<div class="num-list">
<li data-n="1"><div class="li-ar">الْعِلْمُ الْمُنَافِي لِلْجَهْلِ</div><div class="li-translit">Al-ʿilmu l-munāfī li-l-jahl</div><div class="li-en"><strong>Knowledge — contradicting ignorance.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">وَالْمَعْنَى: أَنْ يَعْلَمَ قَائِلُهَا مَعْنَاهَا: أَنَّهُ لَا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ تَعَالَى، وَأَنَّ كُلَّ مَا سِوَاهُ مِنَ الْآلِهَةِ بَاطِلٌ.</em>The one who says it must <strong>know its meaning</strong>: that no deity is worthy of worship by right except Allah, and that every other deity is false.</div></li>

<li data-n="2"><div class="li-ar">الْيَقِينُ الْمُنَافِي لِلشَّكِّ وَالتَّرَدُّدِ</div><div class="li-translit">Al-yaqīnu l-munāfī li-sh-shakki wa t-taraddud</div><div class="li-en"><strong>Certainty — contradicting doubt and wavering.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">وَالْمَعْنَى: أَنْ يُوقِنَ فِي قَلْبِهِ بِمَعْنَى هَذِهِ الْكَلِمَةِ، وَأَنَّ اللَّهَ تَعَالَى وَحْدَهُ هُوَ الْمُسْتَحِقُّ لِلْعِبَادَةِ، وَلَا يَتَرَدَّدُ فِي ذَلِكَ وَلَا يَشُكُّ فِيهِ، فَمَنْ شَكَّ فِي وَحْدَانِيَّةِ اللَّهِ فَلَيْسَ بِمُسْلِمٍ.</em>He must be <strong>certain in his heart</strong> about its meaning; Allah alone deserves worship, and he does not waver or doubt. Whoever doubts Allah’s oneness is not a Muslim.</div></li>

<li data-n="3"><div class="li-ar">الْإِخْلَاصُ الْمُنَافِي لِلشِّرْكِ</div><div class="li-translit">Al-ikhlāṣu l-munāfī li-sh-shirk</div><div class="li-en"><strong>Sincerity — contradicting shirk.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">وَالْمَعْنَى: أَنْ لَا يَجْعَلَ لِلَّهِ شَرِيكًا، فَمَنْ جَعَلَ لِلَّهِ نِدًّا لَمْ يَصِحَّ تَوْحِيدُهُ، وَهَذَا يَقْتَضِي تَصْفِيَةَ الْعَمَلِ كُلِّهِ مِنْ جَمِيعِ شَوَائِبِ الشِّرْكِ.</em>He must <strong>not make any partner for Allah</strong>. Whoever makes a rival for Allah, his tawhid is not valid. This requires purifying all deeds from every taint of shirk.</div></li>

<li data-n="4"><div class="li-ar">الصِّدْقُ الْمُنَافِي لِقَوْلِهَا كَذِبًا</div><div class="li-translit">Aṣ-ṣidqu l-munāfī li-qawlihā kadhiban</div><div class="li-en"><strong>Truthfulness — contradicting saying it as a lie.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">وَالْمَعْنَى: بِأَنْ يَقُولَهَا بِلِسَانِهِ مُصَدِّقًا بِهَا قَلْبُهُ، خِلَافًا لِلْمُنَافِقِ الَّذِي يَقُولُهَا بِلِسَانِهِ، وَقَلْبُهُ مُكَذِّبٌ بِهَا.</em>He must say it with his tongue while his <strong>heart believes it</strong> — unlike the hypocrite who says it with his tongue while his heart <strong>denies it</strong>.</div></li>

<li data-n="5"><div class="li-ar">الْمَحَبَّةُ الْمُنَافِيَةُ لِبُغْضِهَا وَبُغْضِ مَا دَلَّتْ عَلَيْهِ</div><div class="li-translit">Al-maḥabbatu l-munāfiyatu li-bughḍihā wa bughḍi mā dallat ʿalayh</div><div class="li-en"><strong>Love — contradicting hatred of it or hatred of what it entails.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">فَيُحِبُّ كَلِمَةَ التَّوْحِيدِ، وَمَا تَقْتَضِيهِ هَذِهِ الْكَلِمَةُ وَالشَّهَادَةُ، وَمَا تَدُلُّ عَلَيْهِ، وَيُبْغِضُ مَا يُنَاقِضُ ذَلِكَ التَّوْحِيدَ.</em>He must <strong>love this word of tawhid</strong> and what it entails, and <strong>hate what contradicts tawhid</strong>.</div></li>

<li data-n="6"><div class="li-ar">الْقَبُولُ الْمُنَافِي لِلرَّدِّ</div><div class="li-translit">Al-qabūlu l-munāfī li-r-radd</div><div class="li-en"><strong>Acceptance — contradicting rejection.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">وَالْمَعْنَى: قَبُولُ مَا اقْتَضَتْهُ هَذِهِ الْكَلِمَةُ بِالْقَلْبِ وَاللِّسَانِ وَالْجَوَارِحِ، وَعَدَمُ رَدِّهَا أَوْ رَدِّ شَيْءٍ مِنْ مَعْنَاهَا.</em>He must <strong>accept what this word requires</strong> — with heart, tongue, and limbs — and <strong>not reject</strong> it or any part of its meaning.</div></li>

<li data-n="7"><div class="li-ar">الِانْقِيَادُ لِمَعْنَاهَا الْمُنَافِي لِلتَّرْكِ وَالِاسْتِكْبَارِ</div><div class="li-translit">Al-inqiyādu li-maʿnāhā l-munāfī li-t-tarki wa l-istikbār</div><div class="li-en"><strong>Submission — contradicting abandonment and arrogance.</strong><br><em style="font-family:'Cormorant Garamond',serif;direction:rtl;font-size:.95rem;display:block;margin:6px 0;line-height:1.8">فَيَنْقَادُ وَيَسْتَسْلِمُ لِمَا دَلَّتْ عَلَيْهِ الْكَلِمَةُ مِنْ تَوْحِيدِ اللَّهِ تَعَالَى، وَاتِّبَاعِ شَرْعِهِ.</em>He must <strong>submit and yield</strong> to what the word indicates — of tawhid of Allah and following His Sharīʿah.</div></li>
</div>

<div class="body-text"><div class="bt-label">📖 Textbook Note</div><div class="bt-ar">الْفَرْقُ بَيْنَ الِانْقِيَادِ وَالْقَبُولِ: أَنَّ الْقَبُولَ إِظْهَارُ صِحَّةِ مَعْنَى ذَلِكَ بِالْقَوْلِ، فَيُعْلِنُ ذَلِكَ نُطْقًا بِاللِّسَانِ، أَمَّا الِانْقِيَادُ فَهُوَ الِاتِّبَاعُ فِي الْأَفْعَالِ.</div><div class="bt-translit">Al-farqu bayna l-inqiyādi wa l-qabūl: anna l-qabūla iẓhāru ṣiḥḥati maʿnā dhālika bi-l-qawl, fa-yuʿlinu dhālika nuṭqan bi-l-lisān, ammā l-inqiyādu fa-huwa l-ittibāʿu fī l-afʿāl.</div><div class="bt-en"><strong>The difference between submission and acceptance:</strong> Acceptance is <strong>declaring the truth of this meaning by speech</strong> — pronouncing it with the tongue. Submission is <strong>following it in actions</strong>.</div></div>

<div class="callout" style="text-align:center"><div class="callout-label">⚠ Important Reminder</div><div class="callout-ar">لِشَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ سَبْعَةُ شُرُوطٍ، يَجِبُ اجْتِمَاعُهَا فِي كُلِّ مُسْلِمٍ.</div><div class="callout-translit">Li-shahādati an lā ilāha illā-llāhu sabʿatu shurūṭin, yajibu jtimāʿuhā fī kulli muslim.</div><div class="callout-en" style="font-weight:600">The testimony has <strong>seven conditions that must ALL be present</strong> in every Muslim. Missing even one makes the testimony deficient.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 How to memorize the 7 conditions</span><div class="study-note-body">A classical Arabic memory rhyme lists the 7 conditions:<br><strong style="font-family:'Cormorant Garamond',serif;font-size:1.1rem;direction:rtl;display:block;margin:8px 0;line-height:2">عِلْمٌ يَقِينٌ إِخْلَاصٌ صِدْقٌ مَحَبَّةٌ ✦ قَبُولٌ انْقِيَادٌ فَافْهَمْهَا وَاحْفَظِ</strong><em style="display:block;margin-bottom:6px;color:var(--muted)">ʿIlmun yaqīnun ikhlāṣun ṣidqun maḥabbah ✦ Qabūlun inqiyādun fa-fahhamhā wa-ḥfaẓ</em>Knowledge, Certainty, Sincerity, Truthfulness, Love ✦ Acceptance, Submission — understand them and memorize.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 Why do all 7 need to be present?</span><div class="study-note-body">Each condition plugs a different hole that could let tawhid "leak out":<br>— <strong>No ʿilm?</strong> You're saying words you don't understand — like reciting a spell.<br>— <strong>No yaqīn?</strong> Doubt corrupts faith — even 1% doubt breaks it.<br>— <strong>No ikhlāṣ?</strong> Doing it for show, not for Allah — that's shirk of intentions.<br>— <strong>No ṣidq?</strong> Saying it with your mouth but denying it in your heart — that's hypocrisy (nifāq).<br>— <strong>No maḥabbah?</strong> You hate what you're saying — impossible to be a true believer.<br>— <strong>No qabūl?</strong> You reject some of what it requires — pick-and-choose Islam.<br>— <strong>No inqiyād?</strong> You accept it verbally but don't live it — empty words.</div></div>`;}
function L5P4(){return `
<div class="sec"><div class="sec-ar">مَتَى تَنْفَعُ شَهَادَةُ أَنْ (لَا إِلَهَ إِلَّا اللَّهُ) قَائِلَهَا؟</div><div class="sec-translit">Matā tanfaʿu shahādatu an (lā ilāha illā-llāh) qāʾilahā?</div><div class="sec-en">When Does the Testimony Benefit Its Sayer?</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">(لَا إِلَهَ إِلَّا اللَّهُ) لَا تَنْفَعُ قَائِلَهَا فَتُنَجِّيَهُ مِنَ النَّارِ وَتُدْخِلَهُ الْجَنَّةَ حَتَّى يَعْمَلَ بِشُرُوطِهَا السَّابِقَةِ، فَلَا يَنْفَعُ شَخْصًا أَنْ يَتَكَلَّمَ بِهَا، وَهُوَ مُخَالِفٌ لِمَعْنَاهَا؛ بِأَنْ يَعْبُدَ غَيْرَ اللَّهِ، وَيُصَدِّقَ بِالطَّوَاغِيتِ، وَلَا يَنْقَادُ لِشَرْعِ اللَّهِ تَعَالَى، وَلَوْ كَانَ الْأَمْرُ مُجَرَّدَ قَوْلٍ بِاللِّسَانِ لَقَالَهَا الْمُشْرِكُونَ وَصَحَّ إِسْلَامُهُمْ، مَعَ بَقَائِهِمْ عَلَى عِبَادَةِ الْآلِهَةِ.</div><div class="bt-translit">(Lā ilāha illā-llāh) lā tanfaʿu qāʾilahā fa-tunajjiyahu mina n-nāri wa tudkhilahu l-jannata ḥattā yaʿmala bi-shurūṭihā s-sābiqa, fa-lā yanfaʿu shakhṣan an yatakallama bihā, wa huwa mukhālifun li-maʿnāhā; bi-an yaʿbuda ghayra-llāh, wa yuṣaddiqa bi-ṭ-ṭawāghīt, wa lā yanqādu li-sharʿi-llāhi taʿālā, wa law kāna l-amru mujarradu qawlin bi-l-lisāni la-qālahā l-mushrikūna wa ṣaḥḥa islāmuhum, maʿa baqāʾihim ʿalā ʿibādati l-ālihah.</div><div class="bt-en">"Lā ilāha illā-llāh" <strong>does not benefit its sayer</strong> — saving him from Fire and entering him into Paradise — <strong>until he acts upon its previous conditions</strong>. It does not benefit a person to merely say it while he <strong>contradicts its meaning</strong> — by worshipping others besides Allah, affirming false deities, and not submitting to Allah’s Sharīʿah. If it were merely a matter of words with the tongue, the polytheists would have said it and their Islam would have been valid, even while they continued worshipping their idols.</div></div>

<div class="verse"><div class="v-ar">﴿أَجَعَلَ الْآلِهَةَ إِلَٰهًا وَاحِدًا ۖ إِنَّ هَٰذَا لَشَيْءٌ عُجَابٌ﴾</div><div class="v-translit">Ajaʿala l-ālihata ilāhan wāḥidā? Inna hādhā la-shayʾun ʿujāb.</div><div class="v-en">"Has he made the gods one God? Indeed, this is a strange thing."</div><div class="v-ref">Sūrat Ṣād 38:5 — what the polytheists said</div></div>

<div class="body-text"><div class="bt-label">📖 A Saying Mentioned in the Textbook</div><div class="bt-ar">وَسُئِلَ وَهْبُ بْنُ مُنَبِّهٍ: أَلَيْسَ (لَا إِلَهَ إِلَّا اللَّهُ) مِفْتَاحَ الْجَنَّةِ؟ قَالَ: بَلَى، وَلَكِنْ لَيْسَ مِفْتَاحٌ إِلَّا لَهُ أَسْنَانٌ، فَإِنْ جِئْتَ بِمِفْتَاحٍ لَهُ أَسْنَانٌ فُتِحَ لَكَ، وَإِلَّا لَمْ يُفْتَحْ لَكَ.</div><div class="bt-translit">Wa suʾila Wahbu bnu Munabbihin: a-laysa (lā ilāha illā-llāh) miftāḥa l-jannah? Qāla: balā, wa lākinna laysa miftāḥun illā lahu asnān, fa-in jiʾta bi-miftāḥin lahu asnānun futiḥa lak, wa illā lam yuftaḥ lak.</div><div class="bt-en">Wahb ibn Munabbih was asked: "Is 'lā ilāha illā-llāh' not the key to Paradise?" He said: "Indeed yes. But there is <strong>no key except that it has teeth (ridges)</strong>. <strong>If you come with a key that has teeth, it will be opened for you. Otherwise, it will not be opened for you.</strong>"</div></div>

<div class="callout" style="text-align:center"><div class="callout-label">⚠ Crucial Principle</div><div class="callout-ar">(لَا إِلَهَ إِلَّا اللَّهُ) لَا تَنْفَعُ قَائِلَهَا حَتَّى يَعْمَلَ بِشُرُوطِهَا.</div><div class="callout-translit">(Lā ilāha illā-llāh) lā tanfaʿu qāʾilahā ḥattā yaʿmala bi-shurūṭihā.</div><div class="callout-en" style="font-weight:600">"Lā ilāha illā-llāh" <strong>does not benefit its sayer</strong> until he <strong>acts upon its conditions</strong>. Saying the words alone — without meaning or action — is not enough.</div></div>

<div class="study-note root-tip"><span class="study-note-label">🌱 Vocabulary: الطَّوَاغِيتُ · Aṭ-Ṭawāghīt</span><div class="study-note-body"><strong>Ṭāghūt</strong> (plural: ṭawāghīt) comes from the root <strong>ط-غ-و (ṭ-gh-w)</strong> meaning "to transgress" or "go beyond limits." It refers to anyone or anything that <strong>accepts being worshipped, obeyed, or followed in disobedience to Allah</strong>.<br><br>The textbook mentions that truly saying the shahādah requires <strong>rejecting all ṭawāghīt</strong> — false deities, idols, anyone demanding obedience that contradicts Allah’s commands. You cannot believe in Allah and also follow something that competes with Allah at the same time.</div></div>

<div class="study-note beginner"><span class="study-note-label">💡 The key with teeth — Wahb’s beautiful example</span><div class="study-note-body">Wahb ibn Munabbih (an early scholar) was asked: "Isn’t 'lā ilāha illā-llāh' the key to Paradise?" He said: "Yes — but a key only works if it <strong>has teeth (ridges)</strong>. A blank, smooth key opens nothing."<br><br>The <strong>7 conditions are the teeth</strong> of the key. Without them, you’re holding a smooth bar of metal — it looks like a key, it might even feel like a key — but it won’t open any door.<br><br>This is why the hypocrites (munāfiqūn) who said the shahādah in the time of the Prophet ﷺ were not truly Muslim — their "key" had no teeth: no sincerity (ikhlāṣ), no truthfulness (ṣidq), no submission (inqiyād).</div></div>

<div class="assessment" id="as5"><div class="section-badge">التَّقْوِيم · Assessment</div><p class="assessment-intro" style="margin-top:8px">Attempt before revealing.</p><div class="activity-controls"><button class="btn-reveal-all" onclick="revealAll(document.getElementById('as5'))">Reveal All</button><button class="btn-hide-all" onclick="hideAll(document.getElementById('as5'))">Hide All</button></div>
<div class="q-item"><span class="q-num">١</span><div class="q-ar">أَكْمِلِ الْفَرَاغَ بِمَا يُنَاسِبُهُ مِنَ الْكَلِمَاتِ: مَعْنَى شَهَادَةِ أَنْ لَا إِلَهَ إِلَّا اللَّهُ:</div><div class="q-en">Complete the blank with what is appropriate: The meaning of the testimony "lā ilāha illā-llāh":</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">أُقِرُّ وَأَعْتَرِفُ وَأُوقِنُ أَنَّهُ لَا مَعْبُودَ بِحَقٍّ إِلَّا اللَّهُ تَعَالَى وَحْدَهُ لَا شَرِيكَ لَهُ، وَأَنْفِي وَأُبْطِلُ كُلَّ مَعْبُودٍ سِوَاهُ. / I acknowledge and am certain there is no deity by right except Allah alone, and I negate every other deity.</div></div>
<div class="q-item"><span class="q-num">٢</span><div class="q-ar">مَتَى تَنْفَعُ شَهَادَةُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ قَائِلَهَا؟</div><div class="q-en">When does the testimony benefit its sayer?</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">تَنْفَعُهُ إِذَا عَمِلَ بِشُرُوطِهَا السَّبْعَةِ. / It benefits him when he acts upon all seven conditions.</div></div>
</div>`;}
function L6P1(){return `
<div class="sec"><div class="sec-ar">مَعْنَى (أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ)</div><div class="sec-translit">Maʿnā (ashhadu anna Muḥammadan rasūlu-llāh)</div><div class="sec-en">The Meaning of "I Bear Witness that Muḥammad is the Messenger of Allah"</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">مَعْنَى (أَشْهَدُ أَنَّ مُحَمَّدًا رَسُولَ اللَّهِ): أُقِرُّ وَأَعْتَرِفُ وَأُوقِنُ بِأَنَّ مُحَمَّدًا ﷺ هُوَ رَسُولُ اللَّهِ، أَرْسَلَهُ إِلَى جَمِيعِ الثَّقَلَيْنِ: الْإِنْسِ وَالْجِنِّ، وَأَنَّهُ خَاتَمُ الْأَنْبِيَاءِ وَالْمُرْسَلِينَ عَلَيْهِمُ الصَّلَاةُ وَالسَّلَامُ.</div><div class="bt-translit">Maʿnā (ashhadu anna Muḥammadan rasūla-llāh): Uqirru wa aʿtarifu wa ūqinu bi-anna Muḥammadan ﷺ huwa rasūlu-llāh, arsalahu ilā jamīʿi th-thaqalayn: al-insi wa l-jinn, wa annahu khātamu l-anbiyāʾi wa l-mursalīna ʿalayhimu ṣ-ṣalātu wa s-salām.</div><div class="bt-en">The meaning: I <strong>acknowledge, admit, and am certain</strong> that <strong>Muḥammad ﷺ is the Messenger of Allah</strong>, sent to all of <strong>the Two Weightier Beings — humans and jinn</strong>, and that he is <strong>the seal of the prophets and messengers</strong> ﷺ.</div></div>

<div class="sec"><div class="sec-ar">مَا تَضَمَّنَتْهُ شَهَادَةُ (أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ)</div><div class="sec-translit">Mā taḍammanat-hu shahādatu (anna Muḥammadan rasūlu-llāh)</div><div class="sec-en">What the Testimony Contains</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">تَضَمَّنَتْ شَهَادَةُ (أَنَّ مُحَمَّدًا رَسُولَ اللَّهِ) ﷺ أُمُورًا مِنْهَا:</div><div class="bt-translit">Taḍammanat shahādatu (anna Muḥammadan rasūla-llāh) ﷺ umūran minhā:</div><div class="bt-en">The testimony "that Muḥammad is the Messenger of Allah" ﷺ contains several matters, including:</div></div>

<div class="num-list">
<li data-n="١"><div class="li-ar">الْإِيمَانُ بِأَنَّهُ مُرْسَلٌ مِنَ اللَّهِ تَعَالَى، بَعَثَهُ اللَّهُ تَعَالَى بِالْحَقِّ وَالْهُدَى بَشِيرًا وَنَذِيرًا.</div><div class="li-translit">Al-īmānu bi-annahu murṣalun mina-llāhi taʿālā, baʿathahu-llāhu taʿālā bi-l-ḥaqqi wa l-hudā bashīran wa nadhīrā.</div><div class="li-en">Believing he is <strong>sent by Allah</strong> — Exalted — who sent him with <strong>truth, guidance, good news, and warning</strong>.</div></li>

<li data-n="٢"><div class="li-ar">الشَّهَادَةُ لَهُ ﷺ بِالرِّسَالَةِ ظَاهِرًا بِاللِّسَانِ، وَبَاطِنًا بِالْقَلْبِ.</div><div class="li-translit">Ash-shahādatu lahu ﷺ bi-r-risālati ẓāhiran bi-l-lisān, wa bāṭinan bi-l-qalb.</div><div class="li-en">Testifying for him ﷺ to the message <strong>outwardly with the tongue</strong> and <strong>inwardly with the heart</strong>.</div></li>

<li data-n="٣"><div class="li-ar">اعْتِقَادُ عُمُومِ رِسَالَتِهِ ﷺ إِلَى جَمِيعِ الثَّقَلَيْنِ: الْإِنْسِ وَالْجِنِّ.</div><div class="li-translit">Iʿtiqādu ʿumūmi risālatihi ﷺ ilā jamīʿi th-thaqalayn: al-insi wa l-jinn.</div><div class="li-en">Believing his message ﷺ is <strong>universal</strong> — to all of the Two Weightier Beings: <strong>humans and jinn</strong>.</div></li>

<li data-n="٤"><div class="li-ar">الْإِيمَانُ بِأَنَّهُ ﷺ خَاتَمُ النَّبِيِّينَ عَلَيْهِمُ الصَّلَاةُ وَالسَّلَامُ، فَلَا نَبِيَّ بَعْدَهُ ﷺ، وَكُلُّ مَنِ ادَّعَى النُّبُوَّةَ بَعْدَهُ فَهُوَ كَاذِبٌ دَجَّالٌ.</div><div class="li-translit">Al-īmānu bi-annahu ﷺ khātamu n-nabiyyīna ʿalayhimu ṣ-ṣalātu wa s-salām, fa-lā nabiyya baʿdahu ﷺ, wa kullu man iddaʿā n-nubuwwata baʿdahu fa-huwa kādhibun dajjāl.</div><div class="li-en">Believing he ﷺ is <strong>the seal of the prophets</strong> ﷺ — <strong>no prophet after him ﷺ</strong>. Whoever claims prophethood after him is a <strong>lying imposter (dajjāl)</strong>.</div></li>

<li data-n="٥"><div class="li-ar">الشَّهَادَةُ لَهُ ﷺ بِأَنَّهُ بَلَّغَ الرِّسَالَةَ، وَأَدَّى الْأَمَانَةَ، وَنَصَحَ الْأُمَّةَ.</div><div class="li-translit">Ash-shahādatu lahu ﷺ bi-annahu ballagha r-risālah, wa addā l-amānah, wa naṣaḥa l-ummah.</div><div class="li-en">Testifying for him ﷺ that he <strong>conveyed the message, fulfilled the trust, and sincerely advised the Ummah</strong>.</div></li>
</div>

<div class="activity" id="al6p1"><div class="section-badge">نَشَاط ١ · Activity 1</div><div class="act-item"><div class="act-prompt"><strong style="color:var(--teal)">بَعْدَ مَعْرِفَتِي لِمَا تَضَمَّنَتْهُ شَهَادَةُ أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ: أُعَدِّدُ خَمْسَةً مِنَ الْأُمُورِ الَّتِي تُنَاقِضُ هَذِهِ الشَّهَادَةَ.</strong><br><em style="color:var(--muted);font-size:.82rem">Baʿda maʿrifatī li-mā taḍammanatihi shahādatu anna Muḥammadan rasūla-llāh: uʿaddidu khamsatan mina l-umūri llatī tunāqiḍu hādhihi sh-shahādah.</em><br>After knowing what the testimony contains, list <strong>five things that contradict this testimony</strong>.</div><button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button><div class="answer-box gold-box">١. إنكارُ أنَّه أُرسل من الله. ٢. رفضُ أيِّ شيء مما بلَّغه. ٣. الاعتقاد بأن رسالته للعرب فقط. ٤. الإيمانُ بنبيٍّ بعده. ٥. معصيته مع العلم بأن ذلك من الله.<br>/ (1) Denying he was sent. (2) Rejecting anything he conveyed. (3) Believing his message was for Arabs only. (4) Believing in a prophet after him. (5) Disobeying him while knowing it contradicts Allah's command.</div></div></div>`;}
function L6P2(){return `
<div class="sec"><div class="sec-ar">مُقْتَضَيَاتُ شَهَادَةِ (أَنَّ مُحَمَّدًا رَسُولُ اللَّهِ)</div><div class="sec-translit">Muqtaḍayātu shahādati (anna Muḥammadan rasūlu-llāh)</div><div class="sec-en">The Requirements of the Testimony</div></div>

<div class="body-text"><div class="bt-label">📖 Textbook Passage</div><div class="bt-ar">لِشَهَادَةِ أَنَّ مُحَمَّدًا رَسُولَ اللَّهِ مُقْتَضَيَاتٌ، أَهَمُّهَا مَا يَأْتِي:</div><div class="bt-translit">Li-shahādati anna Muḥammadan rasūla-llāhi muqtaḍayātun, ahammuhā mā yaʾtī:</div><div class="bt-en">The testimony that Muḥammad is the Messenger of Allah has <strong>requirements</strong>, the most important of which are:</div></div>

<div class="num-list">
<li data-n="أ"><div class="li-ar">تَصْدِيقُهُ ﷺ فِي جَمِيعِ مَا أَخْبَرَ بِهِ، وَيَدْخُلُ فِي ذَلِكَ:<br>١. مَا أَخْبَرَ بِهِ عَنْ رَبِّهِ جَلَّ وَعَلَا مِنْ أَسْمَائِهِ وَصِفَاتِهِ، وَشَرْعِهِ وَوَحْيِهِ.<br>٢. مَا أَخْبَرَ بِهِ عَنِ الْأَنْبِيَاءِ السَّابِقِينَ عَلَيْهِمُ الصَّلَاةُ وَالسَّلَامُ، وَالْأُمَمِ الْمَاضِينَ.<br>٣. مَا أَخْبَرَ بِهِ عَنِ الْأُمُورِ الْمُسْتَقْبَلِيَّةِ الْوَاقِعَةِ فِي الدُّنْيَا وَالْآخِرَةِ.</div><div class="li-translit">Taṣdīquhu ﷺ fī jamīʿi mā akhbara bih, wa yadkhulu fī dhālika:<br>1. Mā akhbara bihi ʿan rabbihi jalla wa ʿalā min asmāʾihi wa ṣifātihi, wa sharʿihi wa waḥyih.<br>2. Mā akhbara bihi ʿani l-anbiyāʾi s-sābiqīna ʿalayhimu ṣ-ṣalātu wa s-salām, wa l-umami l-māḍīn.<br>3. Mā akhbara bihi ʿani l-umūri l-mustaqbaliyyati l-wāqiʿati fī d-dunyā wa l-ākhirah.</div><div class="li-en"><strong>أ. Believing him ﷺ in everything he conveyed</strong>, which includes:<br>(1) What he conveyed about his Lord — of His Names, Attributes, Sharīʿah, and Revelation.<br>(2) What he conveyed about the previous prophets ﷺ and past nations.<br>(3) What he conveyed about future matters occurring in this world and the Hereafter.</div></li>

<li data-n="ب"><div class="li-ar">طَاعَتُهُ ﷺ فِيمَا أَمَرَ بِهِ، وَاجْتِنَابُ مَا نَهَى عَنْهُ.</div><div class="li-translit">Ṭāʿatuhu ﷺ fī mā amara bih, wa jtinābu mā nahā ʿanh.</div><div class="li-en"><strong>ب. Obeying him ﷺ</strong> in what he commanded and <strong>avoiding what he prohibited</strong>.</div></li>

<li data-n="ج"><div class="li-ar">مُتَابَعَتُهُ ﷺ، بِأَنْ لَا يُعْبَدَ اللَّهُ تَبَارَكَ وَتَعَالَى إِلَّا بِمَا شَرَعَهُ.</div><div class="li-translit">Mutābaʿatuhu ﷺ, bi-an lā yuʿbada-llāhu tabāraka wa taʿālā illā bi-mā sharaʿah.</div><div class="li-en"><strong>ج. Following him ﷺ</strong> — worshipping Allah only <strong>by what he legislated</strong>.</div></li>

<li data-n="د"><div class="li-ar">مَحَبَّتُهُ ﷺ، وَهَذِهِ الْمَحَبَّةُ يَجِبُ أَنْ تَكُونَ مُقَدَّمَةً عَلَى مَحَبَّةِ جَمِيعِ الْمَخْلُوقِينَ، مِنَ النَّفْسِ وَالزَّوْجَةِ وَالْوَلَدِ وَالْوَالِدِ. عَنْ أَنَسٍ ﷺ قَالَ: قَالَ رَسُولُ اللَّهِ ﷺ: «لَا يُؤْمِنُ أَحَدُكُمْ حَتَّى أَكُونَ أَحَبَّ إِلَيْهِ مِنْ وَالِدِهِ وَوَلَدِهِ وَالنَّاسِ أَجْمَعِينَ».</div><div class="li-translit">Maḥabbatahu ﷺ, wa hādhihi l-maḥabbatu yajibu an takūna muqaddamatan ʿalā maḥabbati jamīʿi l-makhlūqīn, mina n-nafsi wa z-zawjati wa l-waladi wa l-wālid. ʿAn Anasin ﷺ qāla: qāla rasūlu-llāhi ﷺ: "Lā yuʾminu aḥadukum ḥattā akūna aḥabba ilayhi min wālidihi wa waladihi wa n-nāsi ajmaʿīn."</div><div class="li-en"><strong>د. Loving him ﷺ</strong> — this love must be <strong>above love of all creation</strong>: self, spouse, children, and parents. From Anas ﷺ: The Messenger of Allah ﷺ said: <strong>"None of you truly believes until I am more beloved to him than his father, his child, and all people."</strong> (Bukhārī 15, Muslim 41)</div></li>

<li data-n="هـ"><div class="li-ar">التَّحَاكُمُ إِلَيْهِ ﷺ فِي جَمِيعِ الْأُمُورِ صَغِيرِهَا وَكَبِيرِهَا، وَذَلِكَ بِالرُّجُوعِ إِلَيْهِ فِي حَيَاتِهِ، وَإِلَى شَرِيعَتِهِ وَسُنَّتِهِ ﷺ بَعْدَ وَفَاتِهِ، وَالتَّسْلِيمُ لِحُكْمِهِ ﷺ، مِنْ غَيْرِ حَرَجٍ مِنَ النَّفْسِ.</div><div class="li-translit">At-taḥākumu ilayhi ﷺ fī jamīʿi l-umūr ṣaghīrihā wa kabīrihā, wa dhālika bi-r-rujūʿi ilayhi fī ḥayātihi, wa ilā sharīʿatihi wa sunnatihi ﷺ baʿda wafātihi, wa t-taslīmu li-ḥukmihi ﷺ, min ghayri ḥarajin mina n-nafs.</div><div class="li-en"><strong>هـ. Referring to him ﷺ for judgement</strong> in all matters — small and large — by returning to him ﷺ during his lifetime, and to his <strong>Sharīʿah and Sunnah</strong> after his death, and <strong>submitting to his ruling without any discomfort</strong>.</div></li>
</div>

<div class="verse"><div class="v-ar">﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ ثُمَّ لَا يَجِدُوا فِي أَنفُسِهِمْ حَرَجًا مِّمَّا قَضَيْتَ وَيُسَلِّمُوا تَسْلِيمًا﴾</div><div class="v-translit">Fa-lā wa rabbika lā yuʾminūna ḥattā yuḥakkimūka fī mā shajara baynahum thumma lā yajidū fī anfusihim ḥarajan mimmā qaḍayta wa yusallimū taslīmā.</div><div class="v-en">"No, by your Lord, they will not believe until they make you judge over their disputes, then find no discomfort in themselves over what you judged, and submit in full submission."</div><div class="v-ref">Sūrat an-Nisāʾ 4:65</div></div>

<div class="num-list">
<li data-n="و"><div class="li-ar">تَعْظِيمُ سُنَّتِهِ ﷺ وَالِاهْتِمَامُ بِهَا.</div><div class="li-translit">Taʿẓīmu sunnatihi ﷺ wa l-ihtimāmu bihā.</div><div class="li-en"><strong>و. Honouring his Sunnah ﷺ</strong> and giving it attention and care.</div></li>

<li data-n="ز"><div class="li-ar">تَجَنُّبُ إِطْرَائِهِ ﷺ وَالْغُلُوِّ فِيهِ، وَرَفْعِهِ فَوْقَ مَنْزِلَتِهِ الَّتِي أَنْزَلَهُ اللَّهُ عَزَّ وَجَلَّ.</div><div class="li-translit">Tajannabu iṭrāʾihi ﷺ wa l-ghuluwwi fīhi, wa rafʿihi fawqa manzilatihillatī anzalahu-llāhu ʿazza wa jall.</div><div class="li-en"><strong>ز. Avoiding exaggeration about him ﷺ</strong> and raising him above the station Allah placed him — Mighty and Majestic.</div></li>

<li data-n="ح"><div class="li-ar">الشَّهَادَةُ لَهُ ﷺ بِأَنَّهُ بَلَّغَ الرِّسَالَةَ، وَأَدَّى الْأَمَانَةَ، وَنَصَحَ الْأُمَّةَ، وَلَمْ يَزَلْ مُجَاهِدًا فِي سَبِيلِ اللَّهِ حَتَّى كَمَّلَ اللَّهُ بِهِ الدِّينَ.</div><div class="li-translit">Ash-shahādatu lahu ﷺ bi-annahu ballagha r-risālah, wa addā l-amānah, wa naṣaḥa l-ummah, wa lam yazal mujāhidan fī sabīli-llāhi ḥattā kammala-llāhu bihi d-dīn.</div><div class="li-en"><strong>ح. Testifying for him ﷺ</strong> that he conveyed the message, fulfilled the trust, sincerely advised the Ummah, and <strong>strove in Allah’s path until Allah completed the religion through him</strong>.</div></li>
</div>

<div class="callout"><div class="callout-label">📌 Key Term: التَّحَاكُمُ · At-Taḥākum</div><div class="callout-ar">التَّحَاكُمُ إِلَيْهِ ﷺ: الرُّجُوعُ إِلَى حُكْمِهِ وَشَرِيعَتِهِ فِي جَمِيعِ الأُمُورِ وَالتَّسْلِيمُ لَهُ مِنْ غَيْرِ حَرَجٍ.</div><div class="callout-translit">At-taḥākumu ilayhi ﷺ: ar-rujūʿu ilā ḥukmihi wa sharīʿatihi fī jamīʿi l-umūr wa t-taslīmu lahu min ghayri ḥaraj.</div><div class="callout-en"><strong>At-Taḥākum</strong> (referring to him for judgement): returning to his ruling and Sharīʿah in all matters and <strong>submitting to it without any discomfort</strong>. This is one of the requirements of the second testimony — you accept the Prophet’s ﷺ rulings as authoritative, not just when they suit you.</div></div>

<div class="callout"><div class="callout-label">📌 Key Term: الغُلُوُّ · Al-Ghuluww</div><div class="callout-ar">الغُلُوُّ: تَجَاوُزُ الحَدِّ فِي تَعْظِيمِ الرَّسُولِ ﷺ وَرَفْعِهِ فَوْقَ مَنْزِلَتِهِ.</div><div class="callout-translit">Al-ghuluww: tajāwuzu l-ḥaddi fī taʿẓīmi r-rasūli ﷺ wa rafʿihi fawqa manzilatih.</div><div class="callout-en"><strong>Al-Ghuluww</strong> (exaggeration): going beyond the limit in venerating the Prophet ﷺ and raising him above his station. Examples: believing he has knowledge of the unseen, calling on him for help after his death, building shrines over his grave. The opposite extreme — belittling him — is also wrong. True love follows the middle path of the Qurʾān and Sunnah.</div></div>

<div class="study-note remember"><span class="study-note-label">⭐ Important to note: love must be paramount</span><div class="study-note-body">Requirement (د) says love of the Prophet ﷺ must be <strong>above love of parents, children, and all people</strong>. The hadith is explicit: <em>"None of you truly believes until I am more beloved to him than his father, his child, and all people."</em> (Bukhārī 15)<br><br>This doesn’t mean you don’t love your family — it means if there’s ever a <em>conflict</em> between following the Prophet ﷺ and pleasing your family, the Prophet’s guidance wins. Love for family is a blessing; love for the Prophet ﷺ is a condition of faith.</div></div>`;}

<div class="sec">
  <div class="sec-ar">تَعْرِيفُ الشِّرْكِ</div>

</div>

<div class="defbox">
