    <div class="defbox-translit">Ash-shirku lughatan: at-taswiyah.</div>
    <div class="defbox-en">To make equal; to equate one thing with another.</div>
  </div>
</div>

<div class="defbox" style="border:2px solid var(--teal-mid)">
  <div class="defbox-tag" style="background:var(--teal-mid)">📌 Technically (Sharʿī) · شَرْعًا — <strong>Memorise</strong></div>
  <div class="defbox-body">
    <div class="defbox-ar">جَعْلُ شَرِيكٍ مَعَ اللَّهِ تَعَالَى.</div>
    <div class="defbox-translit">Jaʿlu sharīkin maʿa-llāhi taʿālā.</div>
    <div class="defbox-en">Making a partner alongside Allah (the Exalted).</div>
  </div>
</div>

<div class="study-note root-tip">
  <span class="study-note-label">🌱 Word root: ش-ر-ك (sh-r-k)</span>
  <div class="study-note-title">الشِّرْك · Shirk</div>
  <div class="study-note-body">
    The root ش-ر-ك (sh-r-k) means <em>to share</em> or <em>to be a partner</em>. In business Arabic, a <strong>sharīk</strong> (شَرِيك) is a business partner, and a <strong>sharika</strong> (شَرِكَة) is a company — ownership split into shares. In ʿaqīdah, shirk means assigning a "partner" to Allah — claiming something shares in what belongs to Him alone. The word itself names the crime: giving a <em>share</em> of Allah's exclusive rights to someone else. No one gets a share of what belongs only to Allah.
  </div>
</div>

<div class="study-note remember">
  <span class="study-note-label">⭐ One sentence to memorise</span>
  <div class="study-note-body">
    <strong>Shirk = making a partner <em>alongside</em> Allah.</strong><br>
    Notice: <em>alongside</em>, not "instead of." A mushrik often still believes in Allah. The problem is placing someone or something <em>next to</em> Him as a co-deity. That is why shirk is so dangerous — it does not always look like full rejection of Allah. It can coexist with a belief in Him.
  </div>
</div>

<div class="sec">
  <div class="sec-ar">أَنْوَاعُ الشِّرْكِ</div>

</div>

<div class="body-text">
  <div class="bt-ar">الشِّرْكُ نَوْعَانِ:</div>
  <div class="bt-translit">Ash-shirku nawʿān:</div>
  <div class="bt-en">Shirk has <strong>two types</strong>:</div>
</div>

<div class="virtue">
  <div class="virtue-head">
    <div class="virtue-n">1</div>
    <div class="virtue-head-text">
      <div class="vh-label">النَّوْعُ الأَوَّلُ · First Type</div>
      <div class="vh-ar">الشِّرْكُ الأَكْبَرُ</div>

  <div class="h-source">Narrated by al-Bukhārī no. 4207 and Muslim no. 86</div>
</div>

<div class="callout">
  <div class="callout-label">📌 Key term: النِّد · An-Nidd</div>

  <div class="callout-en"><strong>An-nidd</strong> (plural: andād) = an equal rival — someone placed as equivalent to Allah in worship, love, or obedience. The ḥadīth uses this precise word: you are assigning a "rival equal" to the One who created you from nothing. The audacity of that act is what makes it the greatest sin.</div>
</div>

<div class="study-note remember">
  <span class="study-note-label">⭐ The devastating logic of this ḥadīth</span>
  <div class="study-note-body">
    The Prophet ﷺ did not just say "shirk is forbidden" — he pointed to the <em>reason</em> it is the greatest sin: <strong>"while He created you."</strong><br><br>

</div>

<div class="sec">

<div class="body-text">

  <div class="v-en">"O my dear son, do not associate partners with Allah. Indeed, shirk is a grave injustice."</div>

  <div class="study-note-body">

</div>

  <div class="bt-en">If a person dies upon shirk, Allah will not forgive it. The evidence:</div>
</div>

<div class="verse">

  <div class="v-en">"Indeed, Allah does not forgive association with Him, but He forgives what is less than that for whom He wills."</div>
  <div class="v-ref">Sūrat an-Nisāʾ 4:48</div>
</div>

<div class="hadith">
  <div class="hadith-label">وَأَيْضًا · Also — ʿAbdullāh ibn Masʿūd ﷺ — Bukhārī no. 4227</div>
  <div class="h-ar">«مَنْ مَاتَ وَهُوَ يَدْعُو مِنْ دُونِ اللَّهِ نِدًّا دَخَلَ النَّارَ»</div>
  <div class="h-translit">"Man māta wa huwa yadʿū min dūni-llāhi nddan dakhala n-nār."</div>
  <div class="h-en"><strong>"Whoever died calling upon a rival alongside Allah will enter the Fire."</strong></div>

    Crucially: this is about dying <em>upon</em> shirk without repenting. Someone who committed shirk and then genuinely repented has that shirk fully forgiven — tawbah is always open during one's lifetime.
  </div>
</div>

`;}

<div class="body-text">
  <div class="bt-label">📖 Textbook Passage</div>
  <div class="bt-ar">كَانَ النَّبِيُّ ﷺ يَخَافُ عَلَى أُمَّتِهِ مِنَ الوُقُوعِ فِي الشِّرْكِ، فَعَنْ مَحْمُودِ بْنِ لَبِيدٍ الأَنْصَارِيِّ ﷺ أَنَّ رَسُولَ اللَّهِ ﷺ قَالَ:</div>
  <div class="bt-translit">Kāna n-nabiyyu ﷺ yakhāfu ʿalā ummatihi min al-wuqūʿi fī sh-shirk. Fa-ʿan Maḥmūdi bni Labīdin l-Anṣāriyyi ﷺ…</div>
  <div class="bt-en">The Prophet ﷺ used to fear for his Ummah falling into shirk. From Maḥmūd ibn Labīd al-Anṣārī ﷺ, that the Messenger of Allah ﷺ said:</div>
</div>

<div class="hadith">
  <div class="hadith-label">حَدِيثٌ · Maḥmūd ibn Labīd al-Anṣārī ﷺ — Aḥmad no. 23630</div>
  <div class="h-ar">«إِنَّ أَخْوَفَ مَا أَخَافُ عَلَيْكُمُ الشِّرْكُ الأَصْغَرُ»، قَالُوا: وَمَا الشِّرْكُ الأَصْغَرُ يَا رَسُولَ اللَّهِ؟ قَالَ: «الرِّيَاءُ، يَقُولُ اللَّهُ عَزَّ وَجَلَّ يَوْمَ يُجَازَى الْعِبَادُ بِأَعْمَالِهِمْ: اذْهَبُوا إِلَى الَّذِينَ كُنْتُمْ تُرَاؤُونَ فِي الدُّنْيَا فَانْظُرُوا هَلْ تَجِدُونَ عِنْدَهُمْ جَزَاءً»</div>
  <div class="h-translit">Inna akhwafa mā akhāfu ʿalaykumu sh-shirku l-aṣghar. Qālū: wa mā sh-shirku l-aṣgharu yā rasūla-llāh? Qāla: ar-riyāʾ. Yaqūlu-llāhu ʿazza wa jalla yawma yujāzā l-ʿibādu bi-aʿmālihim: idhabū ilā lladhīna kuntum turāʾūna fī d-dunyā fa-nẓurū hal tajidūna ʿindahum jazāʾ.</div>
  <div class="h-en">"<strong>What I fear most for you is minor shirk.</strong>" They said: "What is minor shirk, O Messenger of Allah?" He said: <strong>"Riyāʾ (showing off). Allah — Mighty and Majestic — will say on the Day when servants are recompensed for their deeds: 'Go to those for whom you used to show off in the world and see whether you find any reward with them.'"</strong></div>
  <div class="h-source">Narrated by Aḥmad no. 23630</div>
</div>

<div class="callout">
  <div class="callout-label">📌 Key term: الرِّيَاء · Ar-Riyāʾ — Showing Off</div>
  <div class="callout-ar">الرِّيَاءُ: إِظْهَارُ الْعِبَادَةِ لِلنَّاسِ رِيَاءً لَا إِخْلَاصًا لِلَّهِ تَعَالَى.</div>
  <div class="callout-translit">Ar-riyāʾu: iẓhāru l-ʿibādati li-n-nāsi riyāʾan lā ikhlāṣan li-llāhi taʿālā.</div>
  <div class="callout-en"><strong>Riyāʾ</strong> from root ر-أ-ي (r-ʾ-y: to see/show) = performing worship in a way that is displayed to people, rather than done purely for Allah. It is called <em>ash-shirk al-khafī</em> (the hidden shirk) by the scholars because it is invisible from outside yet corrupts the deed entirely. The antidote is <strong>ikhlāṣ</strong> — doing the deed exactly as you would if only Allah saw it.</div>
</div>

<div class="study-note watch-out">
  <span class="study-note-label">⚠️ Riyāʾ is subtle — everyday examples</span>
  <div class="study-note-body">
    On Judgement Day, Allah will tell the riyāʾ-doer: <em>"Go find your reward from those you wanted to impress."</em> Those people will have nothing for you. You performed for the wrong audience.<br><br>
    Common forms:<br>
    • Praying longer or more beautifully when someone is watching.<br>
    • Giving charity publicly to be praised for generosity.<br>
    • Posting acts of worship on social media for likes.<br>
    • Reciting Qur'an more carefully when others can hear.<br><br>
    <strong>The test:</strong> "Would I do this the same way if only Allah saw it and no human ever knew?" If the honest answer involves any downgrade — purify the intention. Say: <em>Yā Allah, I'm doing this for You alone.</em>
  </div>
</div>

<div class="body-text">
  <div class="bt-label">📖 Textbook — the two obligations this creates</div>
  <div class="bt-ar">فَإِذَا كَانَ النَّبِيُّ ﷺ يُخَاطِبُ أَصْحَابَهُ ﷺ بِهَذَا وَيَخَافُ عَلَيْهِمْ مِنَ الشِّرْكِ الأَصْغَرِ، فَغَيْرُهُمْ مِمَّنْ هُوَ دُونَهُمْ فِي العِلْمِ وَالعِبَادَةِ أَوْلَى بِالخَوْفِ مِنَ الشِّرْكِ، وَإِذَا كَانَ هَذَا فِي الشِّرْكِ الأَصْغَرِ فَالشِّرْكُ الأَكْبَرُ أَوْلَى أَنْ يُخَافَ مِنَ الوُقُوعِ فِيهِ. وَهَذَا يُوجِبُ عَلَيْنَا أَمْرَيْنِ:</div>
  <div class="bt-translit">Fa-idhā kāna n-nabiyyu ﷺ yakhāfu ʿalā ummatihi min ash-shirki l-aṣghar, fa-ghayruhum mimman huwa dūnahum fī l-ʿilmi wa l-ʿibādati awlā bi-l-khawf. Wa hādhā yūjibu ʿalaynā amrayn:</div>
  <div class="bt-en">If the Prophet ﷺ feared minor shirk for the companions ﷺ — the greatest people in this Ummah in knowledge and worship — then those after them who are lesser are even more in need of this fear. This creates two obligations:</div>
</div>

<ul class="num-list">
  <li data-n="الأَوَّل">
    <div class="li-ar">مَعْرِفَةُ الشِّرْكِ</div>
    <div class="li-translit">Maʿrifatu sh-shirk</div>
    <div class="li-en"><strong>Knowing shirk</strong> — because whoever does not know it may fall into it without realising. You cannot avoid what you cannot recognise.</div>
  </li>
  <li data-n="الثَّانِي">
    <div class="li-ar">الحَذَرُ مِنَ الشِّرْكِ وَالخَوْفُ مِنَ الوُقُوعِ فِيهِ</div>
    <div class="li-translit">Al-ḥadharu mina sh-shirki wa l-khawfu mina l-wuqūʿi fīh</div>
    <div class="li-en"><strong>Guarding against shirk and fearing falling into it</strong> — because whoever fears something avoids it, and whoever feels safe from something tends to fall into it through negligence.</div>
  </li>
</ul>

<div class="body-text">
  <div class="bt-label">📖 Supporting ḥadīths — the Prophet ﷺ foretold shirk in this Ummah</div>
  <div class="bt-ar">وَقَدْ أَخْبَرَ النَّبِيُّ ﷺ بِأَكْثَرَ مِنْ حَدِيثٍ عَنْ وُقُوعِ الشِّرْكِ فِي هَذِهِ الأُمَّةِ، وَمَا أَخْبَرَ بِهِ النَّبِيُّ ﷺ وَاقِعٌ لَا مَحَالَةَ.</div>
  <div class="bt-translit">Wa qad akhbara n-nabiyyu ﷺ bi-akthara min ḥadīthin ʿan wuqūʿi sh-shirki fī hādhihi l-ummah, wa mā akhbara bihi n-nabiyyu ﷺ wāqiʿun lā maḥālatah.</div>
  <div class="bt-en">The Prophet ﷺ foretold in multiple ḥadīths that shirk would occur in this Ummah. What the Prophet ﷺ foretold will inevitably happen.</div>
</div>

<div class="hadith">
  <div class="hadith-label">① حَدِيثٌ · ʿĀʾishah ﷺ — Muslim no. 2907</div>
  <div class="h-ar">«لَا يَذْهَبُ اللَّيْلُ وَالنَّهَارُ حَتَّى تُعْبَدَ اللَّاتُ وَالْعُزَّى»</div>
  <div class="h-translit">Lā yadhhabu l-laylu wa n-nahāru ḥattā tuʿbada l-lātu wa l-ʿuzzā.</div>
  <div class="h-en"><strong>"The night and day will not pass away until al-Lāt and al-ʿUzzā are worshipped."</strong></div>
</div>

<div class="hadith">
  <div class="hadith-label">② حَدِيثٌ · Thawbān ﷺ — Aḥmad 22394, Abū Dāwūd 4252</div>
  <div class="h-ar">«…وَلَا تَقُومُ السَّاعَةُ حَتَّى تَلْحَقَ قَبَائِلُ مِنْ أُمَّتِي بِالْمُشْرِكِينَ، وَحَتَّى تَعْبُدَ قَبَائِلُ مِنْ أُمَّتِي الأَوْثَانَ»</div>
  <div class="h-translit">Wa lā taqūmu s-sāʿatu ḥattā talḥaqa qabāʾilu min ummatī bi-l-mushrikīna, wa ḥattā taʿbuda qabāʾilu min ummatī l-awthān.</div>
  <div class="h-en"><strong>"…The Hour will not come until tribes from my Ummah join the polytheists, and until tribes from my Ummah worship idols."</strong></div>
</div>

<div class="study-note remember">
  <span class="study-note-label">⭐ Why these ḥadīths matter</span>
  <div class="study-note-body">
    The Prophet ﷺ predicted that people who call themselves Muslim will fall into idolatry. This has happened historically and continues. The lesson: <strong>belonging to the Muslim community does not automatically protect you from shirk.</strong> You must actively know it, fear it, and guard against it. Complacency is the enemy.
  </div>
</div>

`;}

<div class="assessment" id="as9p3">

  <div class="q-item">

    <button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button>
    <div class="answer-box gold-box">

      (2) The seven destroyers ḥadīth — shirk listed first (Bukhārī 6857, Muslim 89).<br>

    </div>

function L10P1(){return `

<div class="sec">
  <div class="sec-ar">المُرَادُ بِالشِّرْكِ فِي الرُّبُوبِيَّةِ</div>
  <div class="sec-translit">Al-murādu bi-sh-shirki fī ar-rubūbiyyah</div>
  <div class="sec-en">What is Meant by Shirk in Lordship</div>
</div>

<div class="defbox" style="border:2px solid var(--teal-mid)">
  <div class="defbox-tag" style="background:var(--teal-mid)">📌 Definition — Memorise</div>
  <div class="defbox-body">
    <div class="defbox-ar">الْمُرَادُ بِالشِّرْكِ فِي الرُّبُوبِيَّةِ: جَعْلُ شَرِيكٍ مَعَ اللَّهِ تَعَالَى فِي رُبُوبِيَّتِهِ.</div>
    <div class="defbox-translit">Al-murādu bi-sh-shirki fī ar-rubūbiyyah: jaʿlu sharīkin maʿa-llāhi taʿālā fī rubūbiyyatihi.</div>
    <div class="defbox-en">Making a partner alongside Allah (the Exalted) in His <strong>Lordship</strong> — in His exclusive actions of creating, providing, owning, managing the universe, giving life, and causing death.</div>
  </div>
</div>

<div class="study-note beginner">
  <span class="study-note-label">💡 Connection to Lesson 1</span>
  <div class="study-note-body">
    From Lesson 1 you know that <em>tawḥīd ar-rubūbiyyah</em> = singling out Allah in <strong>His actions</strong> — what He does: creating, providing, sustaining, managing all affairs. Shirk in rubūbiyyah is the direct opposite: claiming someone else also <em>does</em> those things. Think of it as a simple flip:<br><br>
    Tawhid of Lordship → "Only Allah controls the universe."<br>
    Shirk in Lordship → "This person/being also controls things in the universe."
  </div>
</div>

<div class="sec">
  <div class="sec-ar">أَمْثِلَةٌ عَلَى الشِّرْكِ فِي الرُّبُوبِيَّةِ</div>
  <div class="sec-translit">Amthilatun ʿalā sh-shirki fī ar-rubūbiyyah</div>
  <div class="sec-en">Examples of Shirk in Lordship</div>
</div>

<div class="body-text">
  <div class="bt-label">📖 Textbook — four examples</div>
  <div class="bt-ar">فَمَنِ اعْتَقَدَ أَنَّ لِأَحَدٍ مِنَ الأَوْلِيَاءِ وَالصَّالِحِينَ الْقُدْرَةَ فِي التَّصَرُّفِ فِي الكَوْنِ وَتَدْبِيرِهِ مُطْلَقًا، فَقَدِ ادَّعَى شَرِيكًا لِلَّهِ فِي رُبُوبِيَّتِهِ.</div>
  <div class="bt-translit">Fa-man iʿtaqada anna li-aḥadin mina l-awliyāʾi wa ṣ-ṣāliḥīna l-qudrata fī t-taṣarrufi fī l-kawni wa tadbirih muṭlaqan, fa-qad iddaʿā sharīkan li-llāhi fī rubūbiyyatih.</div>
  <div class="bt-en">Whoever believes any of the awliyāʾ or the righteous have <em>absolute</em> power to control and manage the universe has claimed a partner for Allah in His Lordship.</div>
</div>

<ul class="num-list">
  <li data-n="1">
    <div class="li-ar">اعْتِقَادُ وُجُودِ خَالِقٍ مَعَ اللَّهِ تَعَالَى</div>
    <div class="li-translit">Iʿtiqādu wujūdi khāliqin maʿa-llāhi taʿālā</div>
    <div class="li-en"><strong>Believing in the existence of a creator alongside Allah</strong> — e.g., believing a second divine being co-created the universe alongside Him.</div>
  </li>
  <li data-n="2">
    <div class="li-ar">اعْتِقَادُ أَنَّ لِأَحَدٍ مِنَ الخَلْقِ القُدْرَةَ عَلَى التَّصَرُّفِ فِي الكَوْنِ</div>
    <div class="li-translit">Iʿtiqādu anna li-aḥadin mina l-khalqi l-qudrata ʿalā at-taṣarrufi fī l-kawn</div>
    <div class="li-en"><strong>Believing any created being has power to control affairs in the universe</strong> — e.g., believing saints, angels, or the dead have independent control over worldly events.</div>
  </li>
  <li data-n="3">
    <div class="li-ar">اعْتِقَادُ أَنَّ أَحَدًا يَعْلَمُ الغَيْبَ المُطْلَقَ غَيْرَ اللَّهِ تَعَالَى</div>
    <div class="li-translit">Iʿtiqādu anna aḥadan yaʿlamu l-ghayba l-muṭlaqa ghayra-llāhi taʿālā</div>
    <div class="li-en"><strong>Believing anyone has absolute knowledge of the unseen besides Allah</strong> — e.g., trusting fortune-tellers or claiming a spiritual figure knows all hidden matters.</div>
  </li>
  <li data-n="4">
    <div class="li-ar">اعْتِقَادُ أَنَّ لِأَحَدٍ القُدْرَةَ المُطْلَقَةَ عَلَى النَّفْعِ وَالضَّرِّ غَيْرَ اللَّهِ تَعَالَى</div>
    <div class="li-translit">Iʿtiqādu anna li-aḥadin al-qudrata l-muṭlaqata ʿalā an-nafʿi wa aḍ-ḍarri ghayra-llāhi taʿālā</div>
    <div class="li-en"><strong>Believing any created being has absolute power to benefit or harm</strong> — independently of Allah's permission and will.</div>
  </li>
</ul>

<div class="verse">
  <div class="v-ar">﴿ذَٰلِكُمُ اللَّهُ رَبُّكُمْ لَهُ الْمُلْكُ ۚ وَالَّذِينَ تَدْعُونَ مِن دُونِهِ مَا يَمْلِكُونَ مِن قِطْمِيرٍ﴾</div>

</div>

<div class="assessment" id="as12p4">

    <div class="q-en">How did the Prophet ﷺ protect tawhid? Provide evidence for each method.</div>
    <div class="q-ar">كَيْفَ حَمَى النَّبِيُّ ﷺ التَّوْحِيدَ؟ مَعَ الدَّلِيلِ.</div>
    <button class="btn-answer" onclick="toggleAnswer(this)">👁 Show Answer</button>

      <strong>(1) Forbade taking his grave as a festival site:</strong><br>
      <em>"Do not make my grave a festival site… your ṣalāh reaches me wherever you are."</em> (Aḥmad 8804) — blocks the means to grave-worship.<br><br>
      <strong>(2) Supplicated against his grave becoming an idol:</strong><br>
      <em>"O Allah, do not make my grave an idol. Allah has cursed a people who took the graves of their prophets as masājid."</em> (Aḥmad 7358) — shows the danger through prophetic curse.<br><br>
      <strong>(3) Forbade exaggeration about himself:</strong><br>
      <em>"I am Muḥammad son of ʿAbdullāh and Messenger of Allah. I do not love that you raise me above the station Allah placed me in."</em> (Nasāʾī 10006) — defines his true station: ʿAbd and Rasūl, nothing more.
